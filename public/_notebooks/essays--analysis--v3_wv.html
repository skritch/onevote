      function __resizeIframe(obj) {
        const scrollbarHeight = 20; // Max between windows, mac, and linux

        function setHeight() {
          // Guard against race condition where iframe isn't ready
          if (!obj.contentWindow?.document?.documentElement) {
            return;
          }
          const element = obj.contentWindow.document.documentElement;
          // If there is no vertical scrollbar, we don't need to resize the iframe
          if (element.scrollHeight === element.clientHeight) {
            return;
          }

          // Create a new height that includes the scrollbar height if it's visible
          const hasHorizontalScrollbar = element.scrollWidth > element.clientWidth;
          const newHeight = element.scrollHeight + (hasHorizontalScrollbar ? scrollbarHeight : 0);

          // Only update the height if it's different from the current height
          if (obj.style.height !== `${newHeight}px`) {
            obj.style.height = `${newHeight}px`;
          }
        }

        // Resize the iframe to the height of the content and bottom scrollbar height
        setHeight();

        // Resize the iframe when the content changes
        const resizeObserver = new ResizeObserver((_entries) => {
          setHeight();
        });
        // Only observe if iframe content is ready
        if (obj.contentWindow?.document?.body) {
          resizeObserver.observe(obj.contentWindow.document.body);
        }
      }
    </script>

ational_electors\u0026quot;,[\u0026quot;number\u0026quot;,\u0026quot;float64\u0026quot;]],[\u0026quot;national_apportionment_population\u0026quot;,[\u0026quot;integer\u0026quot;,\u0026quot;int64\u0026quot;]],[\u0026quot;national_vap_estimate\u0026quot;,[\u0026quot;number\u0026quot;,\u0026quot;float64\u0026quot;]],[\u0026quot;national_vep_estimate\u0026quot;,[\u0026quot;number\u0026quot;,\u0026quot;float64\u0026quot;]],[\u0026quot;national_votes_total\u0026quot;,[\u0026quot;integer\u0026quot;,\u0026quot;int64\u0026quot;]],[\u0026quot;national_votes_democrat\u0026quot;,[\u0026quot;number\u0026quot;,\u0026quot;float64\u0026quot;]],[\u0026quot;national_votes_republican\u0026quot;,[\u0026quot;number\u0026quot;,\u0026quot;float64\u0026quot;]],[\u0026quot;national_electors_democrat\u0026quot;,[\u0026quot;number\u0026quot;,\u0026quot;float64\u0026quot;]],[\u0026quot;national_electors_republican\u0026quot;,[\u0026quot;number\u0026quot;,\u0026quot;float64\u0026quot;]],[\u0026quot;national_winning_party\u0026quot;,[\u0026quot;unknown\u0026quot;,\u0026quot;str\u0026quot;]],[\u0026quot;apportionment_population_pct\u0026quot;,[\u0026quot;number\u0026quot;,\u0026quot;float64\u0026quot;]],[\u0026quot;elector_pct\u0026quot;,[\u0026quot;number\u0026quot;,\u0026quot;float64\u0026quot;]]]' data-show-filters='true' data-show-download='true' data-show-column-summaries='false' data-show-data-types='true' data-show-page-size-selector='false' data-show-column-explorer='true' data-show-chart-builder='true' data-row-headers='[]' data-has-stable-row-id='false' data-lazy='false' data-preload='false'\u003E\u003C/marimo-table\u003E\u003C/marimo-ui-element\u003E"}, "type": "data"}]}, {"code_hash": "ba4a2c7ad2dfebcd2c31dc69b7cb2377", "console": [], "id": "MJUe", "outputs": [{"data": {"text/markdown": "\u003Cspan class=\"markdown prose dark:prose-invert contents\"\u003E\u003Ch1 id=\"wasted-votes-at-l3\"\u003EWasted Votes at L3\u003C/h1\u003E\u003C/span\u003E"}, "type": "data"}]}, {"code_hash": "98ebf4be9aab97320f6a439d62c46de7", "console": [], "id": "vblA", "outputs": [{"data": {"text/markdown": "\u003Cspan class=\"markdown prose dark:prose-invert contents\"\u003E\u003Cspan class=\"paragraph\"\u003EWe'll now consider \"wasted\" votes \u003Cem\u003Ewith\u003C/em\u003E party affiliations in mind, i.e. at L3. For now we're still going to limit our attention to P3 (a simplified electoral college) and ignore abstentions and third parties.\u003C/span\u003E\n\u003Cspan class=\"paragraph\"\u003EThe standard definition of a \u003Cstrong\u003Ewasted vote\u003C/strong\u003E is this. A state-level vote is \"wasted\" if:\u003C/span\u003E\n\u003Cul\u003E\n\u003Cli\u003Eit contributes to a losing candidate\u003C/li\u003E\n\u003Cli\u003Eor it contributes to a winning candidate but in excess of the threshold required to win\u003C/li\u003E\n\u003C/ul\u003E\n\u003Cspan class=\"paragraph\"\u003EFor a two-party election with no abstentions, the threshold to win would be half the total number of votes. But if we allow abstentions, or add a third party, there's no way exact threshold, and we should use the second-place vote count as an effective threshold instead. The version with just two parties is uninteresting, so we'll only consider the general case from here on.\u003C/span\u003E\n\u003Cspan class=\"paragraph\"\u003ELet's devise some notation. We'll use \u003Cmarimo-tex class=\"arithmatex\"\u003E||(v(x)||)\u003C/marimo-tex\u003E to represent a candidate's vote, and v(s) to represent the vote of an entire state. Let\u003C/span\u003E\n\u003Cmarimo-tex class=\"arithmatex\"\u003E||[\nR_p(s) = \\sum_{\\substack{x \\in s \\\\ v(x) = p}} 1\n||]\u003C/marimo-tex\u003E\u003Cspan class=\"paragraph\"\u003Ebe the number of votes cast for some party \u003Cmarimo-tex class=\"arithmatex\"\u003E||(p||)\u003C/marimo-tex\u003E in state \u003Cmarimo-tex class=\"arithmatex\"\u003E||(s||)\u003C/marimo-tex\u003E.\u003C/span\u003E\n\u003Cspan class=\"paragraph\"\u003EThen our two definitions of wasted votes are:\u003C/span\u003E\n\u003Cmarimo-tex class=\"arithmatex\"\u003E||[\n\\begin{align}\n\\text{Wasted}_p(s) \u0026amp;= \\begin{cases}\n  R_{{p}_1}(s) - R_{p_2}(s) \u0026amp; \\\\\n  R_p(s)  \u0026amp; (p \\ne p_1)\\\\\n\\end{cases}\n\\quad\\quad\\quad\\quad\u0026amp; \\text{(in general)}\n\\end{align}\n||]\u003C/marimo-tex\u003E\u003Cspan class=\"paragraph\"\u003Ewhere \u003Cmarimo-tex class=\"arithmatex\"\u003E||(p_1||)\u003C/marimo-tex\u003E is the first place party, \u003Cmarimo-tex class=\"arithmatex\"\u003E||(p_2||)\u003C/marimo-tex\u003E is second place, etc.\u003C/span\u003E\n\u003Chr /\u003E\u003C/span\u003E"}, "type": "data"}]}, {"code_hash": "8221cbf22a53859631af356f6241dace", "console": [], "id": "bkHC", "outputs": [{"data": {"text/markdown": "\u003Cspan class=\"markdown prose dark:prose-invert contents\"\u003E\u003Ch2 id=\"efficiency-gap\"\u003EEfficiency Gap\u003C/h2\u003E\u003C/span\u003E"}, "type": "data"}]}, {"code_hash": "805c34c0afe3743d237a873b5c3e5ed4", "console": [], "id": "lEQa", "outputs": [{"data": {"text/markdown": "\u003Cspan class=\"markdown prose dark:prose-invert contents\"\u003E\u003Cspan class=\"paragraph\"\u003EWe can introduce one standard measure of \"waste\" here: the \u003Cstrong\u003Eefficiency gap\u003C/strong\u003E, which compares the waste of two parties across the entire election.\u003C/span\u003E\n\u003Cmarimo-tex class=\"arithmatex\"\u003E||[\n\\begin{align}\n\\text{EffGap}_1[P2] \u0026amp;= \\frac{\\text{Wasted}_{1} - \\text{Wasted}_{0}}{N} \\\\\n  \u0026amp;= \\frac{\\sum_s (\\text{Wasted}_1(s) - \\text{Wasted}_0(s))}{N}\n\\end{align}\n||]\u003C/marimo-tex\u003E\u003Cspan class=\"paragraph\"\u003EHere \u003Cmarimo-tex class=\"arithmatex\"\u003E||(N||)\u003C/marimo-tex\u003E should be VEP or VP, though the interpretation differs in each case.\u003C/span\u003E\n\u003Cspan class=\"paragraph\"\u003EIn general we expect the winning party to waste fewer votes, so we will compute efficiency gap as the losing party minus the winning, that is,\u003C/span\u003E\n\u003Cmarimo-tex class=\"arithmatex\"\u003E||[\n\\begin{align}\n\\text{EffGap}_L[P2] \u0026amp;= \\frac{\\text{Wasted}_{L} - \\text{Wasted}_{W}}{N} \\\\\n\\end{align}\n||]\u003C/marimo-tex\u003E\u003C/span\u003E"}, "type": "data"}]}, {"code_hash": "7cf956c51d18f1846020a86820f2c0f1", "console": [], "id": "PKri", "outputs": [{"data": {"text/plain": ""}, "type": "data"}]}, {"code_hash": "85ccfa34b6c05aab1b62112cab1aa657", "console": [], "id": "Xref", "outputs": [{"data": {"text/plain": ""}, "type": "data"}]}, {"code_hash": "d2c514e61cb819b655ce7d7f8a91d418", "console": [], "id": "SFPL", "outputs": [{"data": {"application/vnd.vegalite.v6+json": "{\n  \"$schema\": \"https://vega.github.io/schema/vega-lite/v6.1.0.json\",\n  \"config\": {\n    \"axis\": {\n      \"grid\": true,\n      \"gridOpacity\": 0.3\n    },\n    \"view\": {\n      \"continuousHeight\": 300,\n      \"continuousWidth\": 300\n    }\n  },\n  \"data\": {\n    \"name\": \"data-a8b98250b6212e8f3f1fe96d2151cf62\"\n  },\n  \"datasets\": {\n    \"data-a8b98250b6212e8f3f1fe96d2151cf62\": [\n      {\n        \"efficiency_gap\": 0.016266533551212096,\n        \"efficiency_gap_b_democrat\": -0.05764541874788365,\n        \"efficiency_gap_democrat\": -0.016266533551212096,\n        \"national_winner\": \"democrat\",\n        \"total_votes\": 81601344,\n        \"total_wasted\": 42393653.0,\n        \"total_wasted_democrat\": 20533141.0,\n        \"total_wasted_republican\": 21860512.0,\n        \"year\": 1976\n      },\n      {\n        \"efficiency_gap\": 0.18150390237905886,\n        \"efficiency_gap_b_democrat\": 0.5178138484101478,\n        \"efficiency_gap_democrat\": 0.18150390237905886,\n        \"national_winner\": \"republican\",\n        \"total_votes\": 86496851,\n        \"total_wasted\": 44286048.0,\n        \"total_wasted_democrat\": 29992782.0,\n        \"total_wasted_republican\": 14293266.0,\n        \"year\": 1980\n      },\n      {\n        \"efficiency_gap n      },\n      \"type\": \"nominal\"\n    },\n    \"tooltip\": [\n      {\n        \"field\": \"year\",\n        \"title\": \"Year\",\n        \"type\": \"ordinal\"\n      },\n      {\n        \"field\": \"national_winner\",\n        \"title\": \"Winner\",\n        \"type\": \"nominal\"\n      },\n      {\n        \"field\": \"total_votes\",\n        \"format\": \",\",\n        \"title\": \"Total Votes Cast\",\n        \"type\": \"quantitative\"\n      },\n      {\n        \"field\": \"total_wasted\",\n        \"format\": \",\",\n        \"title\": \"Total Wasted Votes\",\n        \"type\": \"quantitative\"\n      },\n      {\n        \"field\": \"efficiency_gap_b_democrat\",\n        \"format\": \".3f\",\n        \"title\": \"Efficiency Gap B (D - R)\",\n        \"type\": \"quantitative\"\n      }\n    ],\n    \"x\": {\n      \"field\": \"year\",\n      \"title\": \"Year\",\n      \"type\": \"ordinal\"\n    },\n    \"y\": {\n      \"field\": \"efficiency_gap_b_democrat\",\n      \"title\": \"Efficiency Gap B (D - R)\",\n      \"type\": \"quantitative\"\n    }\n  },\n  \"height\": 400,\n  \"mark\": {\n    \"type\": \"bar\"\n  },\n  \"title\": \"Efficiency Gap B by Year (1976-2024)\",\n  \"usermeta\": {\n    \"embedOptions\": {}\n  },\n  \"width\": 600\n}"}, "type": "data"}]}, {"code_hash": "dddfb92855d1965f0bc457040db0c8c6", "console": [], "id": "Kclp", "outputs": [{"data": {"text/markdown": "\u003Cspan class=\"markdown prose dark:prose-invert contents\"\u003E\u003Cspan class=\"paragraph\"\u003EWe see that the winning party usually wastes a small fraction of their votes, again with the exception of 2000 and 2004.\u003C/span\u003E\u003C/span\u003E"}, "type": "data"}]}, {"code_hash": "eb843476b44ae93c628cf954bba95332", "console": [], "id": "emfo", "outputs": [{"data": {"text/markdown": "\u003Cspan class=\"markdown prose dark:prose-invert contents\"\u003E\u003Ch2 id=\"v3-wasted-vote-value\"\u003E\u003Cstrong\u003EV3\u003C/strong\u003E: Wasted Vote Value\u003C/h2\u003E\u003C/span\u003E"}, "type": "data"}]}, {"code_hash": "b84e2c6c552e835a1d2aadf43891dbdb", "console": [], "id": "Hstk", "outputs": [{"data": {"text/markdown": "\u003Cspan class=\"markdown prose dark:prose-invert contents\"\u003E\u003Cspan class=\"paragraph\"\u003EThe above Efficiency Gap is more-or-less a standard measure, but I do not find it very interesting. Perhaps it's more applicable to gerrymandering.\u003C/span\u003E\n\u003Cspan class=\"paragraph\"\u003EMy first problem with it is that it does not feel useful or interesting treat \u003Cem\u003Esome\u003C/em\u003E of the winning votes as wasted while others are not.\u003C/span\u003E\n\u003Cspan class=\"paragraph\"\u003EBy the standard definition of waste, \u003Cmarimo-tex class=\"arithmatex\"\u003E||(R_W(s) - R_L(s)||)\u003C/marimo-tex\u003E of the winning party's votes in a state \u003Cmarimo-tex class=\"arithmatex\"\u003E||(s||)\u003C/marimo-tex\u003E are \"wasted\", while \u003Cmarimo-tex class=\"arithmatex\"\u003E||(R_L(s)||)\u003C/marimo-tex\u003E are \"counted\". The \u003Cmarimo-tex class=\"arithmatex\"\u003E||(R_L(s)||)\u003C/marimo-tex\u003E votes for the losing party are \"wasted\" was well, for a total waste of \u003Cmarimo-tex class=\"arithmatex\"\u003E||(R_W(s)||)\u003C/marimo-tex\u003E. Efficiency Gap just measures how these fall out along party lines. T\u003C/span\u003E\n\u003Cspan class=\"paragraph\"\u003EThen, along the lines of our earlier WTAV value, the \"total\" value of the non-wasted votes in the national election is \u003Cmarimo-tex class=\"arithmatex\"\u003E||(\\frac{e_s}{E}N||)\u003C/marimo-tex\u003E.\u003C/span\u003E\n\u003Cspan class=\"paragraph\"\u003EWithout some notion of the \"ordering\" of the votes, we can't say \u003Cem\u003Ewhich\u003C/em\u003E are wasted. So we might as well say every one of the \u003Cmarimo-tex class=\"arithmatex\"\u003E||(R_W(s)||)\u003C/marimo-tex\u003E votes for the winning party is worth a fraction \u003Cmarimo-tex class=\"arithmatex\"\u003E||(\\frac{1}{R_W(s)}||)\u003C/marimo-tex\u003E of thetotal value. That is: all of the \u003Cmarimo-tex class=\"arithmatex\"\u003E||(R_W(s)||)\u003C/marimo-tex\u003E votes for the winning party are worth \u003Cmarimo-tex class=\"arithmatex\"\u003E||(\\frac{n_s/2}{R_W(s)} \\cdot 2 \\cdot \\frac{e_s / E}{n_s / N} = \\frac{e_s / E}{R_W(s) / N}||)\u003C/marimo-tex\u003E each.\u003C/span\u003E\n\u003Cspan class=\"paragraph\"\u003EThe weights are already normalized: in each state the sum over the winning party comes to \u003Cmarimo-tex class=\"arithmatex\"\u003E||(\\frac{e_s}{E}N||)\u003C/marimo-tex\u003E, which sums to \u003Cmarimo-tex class=\"arithmatex\"\u003E||(N||)\u003C/marimo-tex\u003E over all states.\u003C/span\u003E\n\u003Cspan class=\"paragraph\"\u003EThis gives us our value-of-a-vote function \u003Cstrong\u003EWasted Vote Value\u003C/strong\u003E (WVV):\u003C/span\u003E\n\u003Cmarimo-tex class=\"arithmatex\"\u003E||[\n\\begin{align}\n\\text{WVV}(x) = \\begin{cases}\n\\frac{e_{s(x)} / E}{R_{v(x)}(s(x)) /N} \u0026amp;\u0026amp; v(x) = v(s(x)) \\\\\n0 \u0026amp;\u0026amp; v(x) \\ne v(s(x))\n\\end{cases}\n\\end{align}\n||]\u003C/marimo-tex\u003E\u003Cspan class=\"paragraph\"\u003ENote we are using \u003Cem\u003Eactual\u003C/em\u003E election outcomes here, i.e. we are operating in the \u003Cem\u003Eex post\u003C/em\u003E regime. You could write the same measure in terms of any of our other \u003Cem\u003Eex ante\u003C/em\u003E definitions of party affiliation: party membership, forecasts, last election's results, etc.\u003C/span\u003E\n\u003Cspan class=\"paragraph\"\u003EAnd, as before, we should use the total votes cast for \u003Cmarimo-tex class=\"arithmatex\"\u003E||(N||)\u003C/marimo-tex\u003E rather than our usual state population.\u003C/span\u003E\n\u003Cspan class=\"paragraph\"\u003EWe can then plot the value of a vote by state. Here we'll only plot the value of the winning party's votes, as the losing party is uniformly zero. (Thus the value will appear to be uniformly larger than 1, when in fact they are offset by a large numbers of zeros such that the mean is exactly 1.)\u003C/span\u003E\n\u003Chr /\u003E\u003C/span\u003E"}, "type": "data"}]}, {"code_hash": "8e4a4912071ab4cc26705ec2684f748f", "console": [], "id": "nWHF", "outputs": [{"data": {"text/html": "\u003Cmarimo-ui-element object-id='nWHF-0' random-id='cb12cdae-e391-9f55-1d6c-d4b112f76294'\u003E\u003Cmarimo-dropdown data-initial-value='[\u0026quot;2024\u0026quot;]' data-label='\u0026quot;\u0026lt;span class=\u0026#92;\u0026quot;markdown prose dark:prose-invert contents\u0026#92;\u0026quot;\u0026gt;\u0026lt;span class=\u0026#92;\u0026quot;paragraph\u0026#92;\u0026quot;\u0026gt;Choose a year: \u0026lt;/span\u0026gt;\u0026lt;/span\u0026gt;\u0026quot;' data-options='[\u0026quot;1976\u0026quot;,\u0026quot;1980\u0026quot;,\u0026quot;1984\u0026quot;,\u0026quot;1988\u0026quot;,\u0026quot;1992\u0026quot;,\u0026quot;1996\u0026quot;,\u0026quot;2000\u0026quot;,\u0026quot;2004\u0026quot;,\u0026quot;2008\u0026quot;,\u0026quot;2012\u0026quot;,\u0026quot;2016\u0026quot;,\u0026quot;2020\u0026quot;,\u0026quot;2024\u0026quot;]' data-allow-select-none='false' data-searchable='false' data-full-width='false'\u003E\u003C/marimo-dropdown\u003E\u003C/marimo-ui-element\u003E"}, "type": "data"}]}, {"code_hash": "a90a48eb03a738ba4f43787590f55747", "console": [], "id": "iLit", "outputs": [{"data": {"application/vnd.vegalite.v6+json": "{\n  \"$schema\": \"https://vega.github.io/schema/vega-lite/v6.1.0.json\",\n  \"config\": {\n    \"axis\": {\n      \"grid\": true,\n      \"gridOpacity\": 0.3\n    },\n    \"view\": {\n      \"continuousHeight\": 300,\n      \"continuousWidth\": 300\n    }\n  },\n  \"datasets\": {\n    \"data-256b252569657294b502c95d3bc2af46\": [\n      {\n        \"apportionment_population\": 5024279,\n        \"apportionment_population_pct\": 1.5158515308410037,\n        \"delegates\": 0,\n        \"elector_pct\": 1.6728624535315986,\n        \"electors\": 9.0,\n        \"electors_ \n      \"title\": \"Apportionment Value\",\n      \"type\": \"quantitative\"\n    }\n  },\n  \"height\": 400,\n  \"mark\": {\n    \"size\": 100,\n    \"type\": \"circle\"\n  },\n  \"title\": \"Winning Party Wasted Vote Value vs. Apportionment Value by State - 2024 Presidential Election\",\n  \"usermeta\": {\n    \"embedOptions\": {}\n  },\n  \"width\": 400\n}"}, "type": "data"}]}, {"code_hash": "ccf900dcf080dc35f783d8c7fee83ee9", "console": [], "id": "qnkX", "outputs": [{"data": {"text/markdown": "\u003Cspan class=\"markdown prose dark:prose-invert contents\"\u003E\u003Ch2 id=\"m3-wvv-inequality\"\u003E\u003Cstrong\u003EM3\u003C/strong\u003E: WVV Inequality\u003C/h2\u003E\n\u003Cspan class=\"paragraph\"\u003ETODO: compute MAD/Var/H?\u003C/span\u003E\n\u003Cspan class=\"paragraph\"\u003EHow do we determine this for a general election? Do we still count half the votes as wasted? Do we count half the \u003Cem\u003Eelectoral\u003C/em\u003E votes as wasted, then? Huh?\u003C/span\u003E\u003C/span\u003E"}, "type": "data"}]}, {"code_hash": "a5070059d9b1a905d464a69af7d563a2", "console": [], "id": "TqIu", "outputs": [{"data": {"text/markdown": "\u003Cspan class=\"markdown prose dark:prose-invert contents\"\u003E\u003Ch2 id=\"v3b-wasted-vote-value-nationally\"\u003E\u003Cstrong\u003EV3b\u003C/strong\u003E: Wasted Vote Value, Nationally\u003C/h2\u003E\n\u003Cspan class=\"paragraph\"\u003EThe electoral college wastes half the \u003Cem\u003Eelectoral\u003C/em\u003E votes, and these likely aren't uniformly distributed.\u003C/span\u003E\n\u003Cspan class=\"paragraph\"\u003ESo we can calculate a measure of the overall election by tallying up:\u003C/span\u003E\n\u003Cul\u003E\n\u003Cli\u003Efor each state in the losing party, all votes are wasted\u003C/li\u003E\n\u003Cli\u003Efor the winning party, the full \"value\" of the election \u003Cmarimo-tex class=\"arithmatex\"\u003E||(N||)\u003C/marimo-tex\u003E is divided up among the \u003Cmarimo-tex class=\"arithmatex\"\u003E||(E_W||)\u003C/marimo-tex\u003E votes for the winning party. Each electoral vote has value \u003Cmarimo-tex class=\"arithmatex\"\u003E||(\\frac{N}{E_W}||)\u003C/marimo-tex\u003E, so state \u003Cmarimo-tex class=\"arithmatex\"\u003E||(s||)\u003C/marimo-tex\u003E is worth \u003Cmarimo-tex class=\"arithmatex\"\u003E||(\\frac{e_s}{E_W}N||)\u003C/marimo-tex\u003E and the votes in that state are worth\u003C/li\u003E\n\u003C/ul\u003E\n\u003Cmarimo-tex class=\"arithmatex\"\u003E||[\n\\text{WVV}_b(x) = \\begin{cases}\n  \\frac{N}{E_W} \\frac{e_{s(x)}}{R_W(s(x))} \u0026amp;\u0026amp; v(x) = v(s(x)) = W\\\\\n  0 \u0026amp;\u0026amp; \\text{otherwise}\n\\end{cases}\n||]\u003C/marimo-tex\u003E\u003Cspan class=\"paragraph\"\u003Ewhere the populations \u003Cmarimo-tex class=\"arithmatex\"\u003E||(N, n_s||)\u003C/marimo-tex\u003E are both VP.\u003C/span\u003E\n\u003Ch2 id=\"m3b-relative-waste\"\u003E\u003Cstrong\u003EM3b\u003C/strong\u003E Relative Waste\u003C/h2\u003E\n\u003Cspan class=\"paragraph\"\u003EA fully general election would waste \u003Cmarimo-tex class=\"arithmatex\"\u003E||(\\frac{N}{2}||)\u003C/marimo-tex\u003E of the nation's votes.\u003C/span\u003E\n\u003Cspan class=\"paragraph\"\u003EA WTA electoral college wastes half the votes in each state.\u003C/span\u003E\n\u003Cspan class=\"paragraph\"\u003EThe electoral college vote wasted \u003Cmarimo-tex class=\"arithmatex\"\u003E||(\\frac{N}{E_W}||)\u003C/marimo-tex\u003E of each of the winning party's electors.\u003C/span\u003E\n\u003Cspan class=\"paragraph\"\u003EHow many votes are wasted nationally?\u003C/span\u003E\n\u003Cspan class=\"paragraph\"\u003ENo point in calculating how many are wasted by-party, since all of one party's votes are wasted.\u003C/span\u003E\u003C/span\u003E"}, "type": "data"}]}, {"code_hash": "ed450b3442394b4b8cba356f60b40b36", "console": [], "id": "Vxnm", "outputs": [{"data": {"text/html": "\u003Cmarimo-ui-element object-id='Vxnm-0' random-id='5a4e86bb-daa7-5bfd-4fb1-ea0a7b5daa3f'\u003E\u003Cmarimo-table
