      function __resizeIframe(obj) {
        const scrollbarHeight = 20; // Max between windows, mac, and linux

        function setHeight() {
          // Guard against race condition where iframe isn't ready
          if (!obj.contentWindow?.document?.documentElement) {
            return;
          }
          const element = obj.contentWindow.document.documentElement;
          // If there is no vertical scrollbar, we don't need to resize the iframe
          if (element.scrollHeight === element.clientHeight) {
            return;
          }

          // Create a new height that includes the scrollbar height if it's visible
          const hasHorizontalScrollbar = element.scrollWidth > element.clientWidth;
          const newHeight = element.scrollHeight + (hasHorizontalScrollbar ? scrollbarHeight : 0);

          // Only update the height if it's different from the current height
          if (obj.style.height !== `${newHeight}px`) {
            obj.style.height = `${newHeight}px`;
          }
        }

        // Resize the iframe to the height of the content and bottom scrollbar height
        setHeight();

        // Resize the iframe when the content changes
        const resizeObserver = new ResizeObserver((_entries) => {
          setHeight();
        });
        // Only observe if iframe content is ready
        if (obj.contentWindow?.document?.body) {
          resizeObserver.observe(obj.contentWindow.document.body);
        }
      }
    </script>

isabled": false, "hide_code": true}, "id": "emfo", "name": "_"}, {"code": "", "code_hash": "41ea2ca022fa3d83e94430fd82a3ca84", "config": {"column": null, "disabled": false, "hide_code": true}, "id": "Hstk", "name": "_"}, {"code": "", "code_hash": "c9f9481aefe832d4bb2b06c708d0c1ae", "config": {"column": null, "disabled": false, "hide_code": true}, "id": "nWHF", "name": "_"}, {"code": "", "code_hash": "02ea18987f58ca7a52b6b6eb1c55cbb9", "config": {"column": null, "disabled": false, "hide_code": true}, "id": "iLit", "name": "_"}, {"code": "", "code_hash": "8e4a4912071ab4cc26705ec2684f748f", "config": {"column": null, "disabled": false, "hide_code": true}, "id": "ZHCJ", "name": "_"}, {"code": "", "code_hash": "a3db50836914b4ea31da96cf3bd220d8", "config": {"column": null, "disabled": false, "hide_code": true}, "id": "ROlb", "name": "_"}, {"code": "", "code_hash": "d29f911b578b86add4e631961eb9047d", "config": {"column": null, "disabled": false, "hide_code": true}, "id": "qnkX", "name": "_"}, {"code": "", "code_hash": "7847ea0c997466abcfdbc14e6ea71ce7", "config": {"column": null, "disabled": false, "hide_code": true}, "id": "TqIu", "name": "_"}, {"code": "", "code_hash": "5bcb28181932243483447da759613a8e", "config": {"column": null, "disabled": false, "hide_code": true}, "id": "Vxnm", "name": "_"}, {"code": "", "code_hash": "1c5ba7d4e28ae8d2e40cdcbca1ce413f", "config": {"column": null, "disabled": false, "hide_code": true}, "id": "DnEU", "name": "_"}, {"code": "", "code_hash": "58a27f5e5fd10fce15845693bf0e1c5f", "config": {"column": null, "disabled": false, "hide_code": true}, "id": "ulZA", "name": "_"}, {"code": "", "code_hash": "9b572a87a3848fdceec117de4665e66a", "config": {"column": null, "disabled": false, "hide_code": true}, "id": "ecfG", "name": "_"}, {"code": "", "code_hash": "3442fa3f5d54a4dab204e44cc0514dd8", "config": {"column": null, "disabled": false, "hide_code": true}, "id": "Pvdt", "name": "_"}, {"code": "", "code_hash": "6203d7a4b7e82fa778234d69989b8770", "config": {"column": null, "disabled": false, "hide_code": true}, "id": "ZBYS", "name": "_"}, {"code": "", "code_hash": "a0b8ab6ad7c09281faa9039c1027da70", "config": {"column": null, "disabled": false, "hide_code": true}, "id": "aLJB", "name": "_"}, {"code": "", "code_hash": "6d8ac72a109024e7ab3f6ad586592200", "config": {"column": null, "disabled": false, "hide_code": false}, "id": "nHfw", "name": "_"}, {"code": "", "code_hash": "624c0575172cf4e0103f941c50282b0d", "config": {"column": null, "disabled": false, "hide_code": true}, "id": "xXTn", "name": "_"}, {"code": "", "code_hash": null, "config": {"column": null, "disabled": false, "hide_code": false}, "id": "AjVT", "name": "_"}], "metadata": {"marimo_version": "0.19.6"}, "version": "1"},
            "session": {"cells": [{"code_hash": "652c4631bb8a71e02b4ba959834632ac", "console": [], "id": "setup", "outputs": [{"data": {"text/plain": ""}, "type": "data"}]}, {"code_hash": "91cad23b10e153757897327633fbd0f3", "console": [], "id": "Hbol", "outputs": [{"data": {"text/markdown": "\u003Cspan class=\"markdown prose dark:prose-invert contents\"\u003E\u003Ch1 id=\"v2-pivotolity-value\"\u003E\u003Cstrong\u003EV2\u003C/strong\u003E: Pivotolity Value\u003C/h1\u003E\n\u003Cspan class=\"paragraph\"\u003Ea.k.a. Banzhaf Power.\u003C/span\u003E\u003C/span\u003E"}, "type": "data"}]}, {"code_hash": "716f1e8583d791328d6440ee0fca973b", "console": [], "id": "MJUe", "outputs": [{"data": {"text/plain": ""}, "type": "data"}]}, {"code_hash": "e74c57cbcaaf2389c3c4b86fe4837e57", "console": [], "id": "vblA", "outputs": [{"data": {"text/markdown": "\u003Cspan class=\"markdown prose dark:prose-invert contents\"\u003E\u003Ch2 id=\"introduction\"\u003EIntroduction\u003C/h2\u003E\u003C/span\u003E"}, "type": "data"}]}, {"code_hash": "004ca888905e9374ba59c47a15bb7022", "console": [], "id": "bkHC", "outputs": [{"data": {"text/markdown": "\u003Cspan class=\"markdown prose dark:prose-invert contents\"\u003E\u003Cspan class=\"paragraph\"\u003EHere is the situation so far:\u003C/span\u003E\n\u003Col\u003E\n\u003Cli\u003EWe have calculated a \"value function\" for voters called Apportionment Value (AV) for the U.S. presidential election, which is a function of the state populations and elector counts alone (making it a level 2 (L2) measure, by my system). AV is indifferent to the \"winner take all\" nature of state elections, so it's not very useful.\u003C/li\u003E\n\u003Cli\u003EWe tried briefly to calculate a \"Winner-Take-All Value\" WTAV to account for this, but quickly realized that every WTA election \"wasted\" 50% of votes; this value function was insensitive to the \u003Cem\u003Esize\u003C/em\u003E of districts, which contradicted our intuition that larger districts are more unfair.\u003C/li\u003E\n\u003C/ol\u003E\n\u003Cspan class=\"paragraph\"\u003EThe extension of these two value functions to various presidential elections scenarios (P1... P5) is obvious and not very interesting.\u003C/span\u003E\n\u003Cspan class=\"paragraph\"\u003ENow we can go two directions:\u003C/span\u003E\n\u003Col start=\"3\"\u003E\n\u003Cli\u003E(a) Attempt to devise a measure, still at L2, which capture winner-take-all elections \u003Cem\u003Eand\u003C/em\u003E accounts for the size of the states.\u003C/li\u003E\n\u003Cli\u003E(b) Continue with (2), but look at L3--calculate the \u003Cem\u003Eactual\u003C/em\u003E wasted votes in various elections and under various scenarios; the WTAV measure may still be interesting these cases.\u003C/li\u003E\n\u003C/ol\u003E\n\u003Cspan class=\"paragraph\"\u003EHere we'll take on 3a.\u003C/span\u003E\u003C/span\u003E"}, "type": "data"}]}, {"code_hash": "f3f9a4dfe05cef0b3b12783702ecbc4c", "console": [], "id": "lEQa", "outputs": [{"data": {"text/markdown": "\u003Cspan class=\"markdown prose dark:prose-invert contents\"\u003E\u003Ch2 id=\"uniform-random-votes\"\u003EUniform Random Votes\u003C/h2\u003E\u003C/span\u003E"}, "type": "data"}]}, {"code_hash": "86e2eec28a4a608211beb105df210af0", "console": [], "id": "PKri", "outputs": [{"data": {"text/markdown": "\u003Cspan class=\"markdown prose dark:prose-invert contents\"\u003E\u003Cspan class=\"paragraph\"\u003EThe problem with WTAV was that intuitively, it feels like, \"winner-take-all\" in smaller districts should ought to \"fairer\" than in large districts. Imagine assigning a state's electors via WTA: assigning one elector to the winner of each House district is certainly more fair than assigning all the electors to the winner of the whole state.\u003C/span\u003E\n\u003Cspan class=\"paragraph\"\u003EIf we don't know the actual party affiliations (or votes), what do we do?\u003C/span\u003E\n\u003Cspan class=\"paragraph\"\u003EOne way to make progress is to try to characterize an electoral system would for \u003Cem\u003Eany\u003C/em\u003E election result, or at least for any \"typical\" election result.\u003C/span\u003E\n\u003Cspan class=\"paragraph\"\u003EThe absolutely simplest way to approach this is to postulate that every election result is equally likely. We imagine each vote going to party \"1\" with probability \u003Cmarimo-tex class=\"arithmatex\"\u003E||(P[v(x) = 1] = 0.5||)\u003C/marimo-tex\u003E, i.e. each vote is distributed as a \u003Cmarimo-tex class=\"arithmatex\"\u003E||(\\text{uniform}(\\{0, 1 \\})||)\u003C/marimo-tex\u003E distribution. Then the resulting number of votes going to \"1\" in an election of \u003Cmarimo-tex class=\"arithmatex\"\u003E||(n||)\u003C/marimo-tex\u003E voters will be distributed as \u003Cmarimo-tex class=\"arithmatex\"\u003E||(\\text{Binomial}(n, 0.5)||)\u003C/marimo-tex\u003E and the full result of \u003Cmarimo-tex class=\"arithmatex\"\u003E||(N||)\u003C/marimo-tex\u003E votes is distributed as a \u003Cmarimo-tex class=\"arithmatex\"\u003E||(\\text{uniform}(\\{0, 1 \\}^N)||)\u003C/marimo-tex\u003E.\u003C/span\u003E\n\u003Cspan class=\"paragraph\"\u003EThat votes are \"random\" is of course completely unrealistic. We can justify this approach somewhat by noting that we need not be thinking of \u003Cmarimo-tex class=\"arithmatex\"\u003E||(\\text{uniform}(\\{0, 1 \\}^N)||)\u003C/marimo-tex\u003E as describing a \u003Cem\u003Eprobability\u003C/em\u003E at all, nor any kind of random event. It merely reflects our own indifference to the actual election results: all possible results are, at this point, under consideration.\u003C/span\u003E\n\u003Cspan class=\"paragraph\"\u003EThis we represent by a uniform measure on the set of all possible outcomes. This of course directly implies a \u003Cmarimo-tex class=\"arithmatex\"\u003E||(\\text{Binomial}(n, 0.5)||)\u003C/marimo-tex\u003E measure on the set of vote \u003Cem\u003Ecounts\u003C/em\u003E, and assigns each candidate the win in \u003Cmarimo-tex class=\"arithmatex\"\u003E||(p=50%||)\u003C/marimo-tex\u003E of cases.\u003C/span\u003E\n\u003Cspan class=\"paragraph\"\u003ELater we can imagine adding information (e.g. within-state correlations), or excluding some outcomes (extremes, or those inconsisent with polls, etc), but it is likely to expect that the \"shape\" of the resulting distribution, in the vicinity of its average, given whatever information we have, still resembles the shape of a binomial. (Approximately I have \"maximum entropy inference\" in mind here, but we'll deal withn that when we come to it.)\u003C/span\u003E\n\u003Cspan class=\"paragraph\"\u003EThe choice of \u003Cmarimo-tex class=\"arithmatex\"\u003E||(p=0.5||)\u003C/marimo-tex\u003E in particular, is suspect, as real elections, it seems as though this should hold in any particular state. But to treat \u003Cmarimo-tex class=\"arithmatex\"\u003E||(p=0.5||)\u003C/marimo-tex\u003E as the \u003Cem\u003Enational\u003C/em\u003E probability will imply some distribution of means in the individual states: some will be dominated by one party, some the other; some will be swing states, some bastions.\u003C/span\u003E\n\u003Cspan class=\"paragraph\"\u003EAt the national level, \u003Cmarimo-tex class=\"arithmatex\"\u003E||(p=50%||)\u003C/marimo-tex\u003E can be justified by observing that, in a two-party system, the parties will tend to converge to platforms which appeal to approximately 50% of the electorate: if they are not competitive, they will tend on average to cede points until they are. (I believe there is a theorem describing this phenomenon for some toy model of political parties.)\u003C/span\u003E\n\u003Chr /\u003E\u003C/span\u003E"}, "type": "data"}]}, {"code_hash": "1c3fc6b0f58638625b8e6a0f72562558", "console": [], "id": "Xref", "outputs": [{"data": {"text/markdown": "\u003Cspan class=\"markdown prose dark:prose-invert contents\"\u003E\u003Cspan class=\"paragraph\"\u003ELet's choose some notation. As before \u003Cmarimo-tex class=\"arithmatex\"\u003E||(x||)\u003C/marimo-tex\u003E will represent a voter, and \u003Cmarimo-tex class=\"arithmatex\"\u003E||(s(x)||)\u003C/marimo-tex\u003E their state. The random variable \u003Cmarimo-tex class=\"arithmatex\"\u003E||(X_i||)\u003C/marimo-tex\u003E will represent the vote of voter \u003Cmarimo-tex class=\"arithmatex\"\u003E||(x_i||)\u003C/marimo-tex\u003E, and the random vector \u003Cmarimo-tex class=\"arithmatex\"\u003E||(\\mathbf{X} = (X_1, \\ldots, X_N)||)\u003C/marimo-tex\u003E represents the votes of the entirely population. \u003Cmarimo-tex class=\"arithmatex\"\u003E||(R||)\u003C/marimo-tex\u003E will be the random variable of the sum of the votes. We have:\u003C/span\u003E\n\u003Cmarimo-tex class=\"arithmatex\"\u003E||[\nR = \\sum_{i=1}^N X_i\n||]\u003C/marimo-tex\u003E\u003Cspan class=\"paragraph\"\u003E\u003Cmarimo-tex class=\"arithmatex\"\u003E||(P||)\u003C/marimo-tex\u003E will be a random variable for the outcome of entire election, with \u003Cmarimo-tex class=\"arithmatex\"\u003E||(P=0||)\u003C/marimo-tex\u003E indicating the event that the first or \"0\" party wins, while \u003Cmarimo-tex class=\"arithmatex\"\u003E||(P=1||)\u003C/marimo-tex\u003E is the event that the second or \"1\" party wins. Evidently \u003Cmarimo-tex class=\"arithmatex\"\u003E||(P = 1_{R \u0026gt; \\frac{N-1}{2}}||)\u003C/marimo-tex\u003E.\u003C/span\u003E\n\u003Cspan class=\"paragraph\"\u003EFor now let us assume \u003Cmarimo-tex class=\"arithmatex\"\u003E||(N||)\u003C/marimo-tex\u003E is odd, so there are no ties. Let us also assume \u003Cmarimo-tex class=\"arithmatex\"\u003E||(N||)\u003C/marimo-tex\u003E is very large, and that voters must cast a vote one way or the other; we are far from considering abstentions.\u003C/span\u003E\n\u003Cspan class=\"paragraph\"\u003EPer the above\u003C/span\u003E\n\u003Cmarimo-tex class=\"arithmatex\"\u003E||[\n\\begin{align}\nX_i \u0026amp;\\sim \\text{uniform}(\\{0, 1 \\})\\\\\n\\mathbf{X} \u0026amp;\\sim \\text{uniform}(\\{0, 1 \\}^N)\\\\\nR \u0026amp;\\sim \\text{Binomial}(N, 0.5)\\\\\nP  = 1_{R \u0026gt; \\frac{N-1}{2}} \u0026amp;\\sim \\text{uniform}(\\{0, 1 \\})\n\\end{align}\n||]\u003C/marimo-tex\u003E\u003Cspan class=\"paragraph\"\u003ENote there are \u003Cmarimo-tex class=\"arithmatex\"\u003E||(2^N||)\u003C/marimo-tex\u003E possible results in the set \u003Cmarimo-tex class=\"arithmatex\"\u003E||(\\{0, 1 \\}^N||)\u003C/marimo-tex\u003E, and \u003Cmarimo-tex class=\"arithmatex\"\u003E||(N+1||)\u003C/marimo-tex\u003E possible vote totals.\u003C/span\u003E\n\u003Chr /\u003E\u003C/span\u003E"}, "type": "data"}]}, {"code_hash": "8166ef6e32763b2d774d76c63fd85f3b", "console": [], "id": "SFPL", "outputs": [{"data": {"text/markdown": "\u003Cspan class=\"markdown prose dark:prose-invert contents\"\u003E\u003Ch2 id=\"pivotality\"\u003EPivotality\u003C/h2\u003E\u003C/span\u003E"}, "type": "data"}]}, {"code_hash": "a97a4bc381e95e9ea9930cefbfb346ff", "console": [], "id": "BYtC", "outputs": [{"data": {"text/markdown": "\u003Cspan class=\"markdown prose dark:prose-invert contents\"\u003E\u003Cspan class=\"paragraph\"\u003EOne line of investigation is to ask: what is the probability that a given voter \"decides\" the entire election--that, if not for their vote, the result would have been different?\u003C/span\u003E\n\u003Cspan class=\"paragraph\"\u003EWe will use the term \"pivotal\" for a voter whose vote decides an election, however we choose to define it.\u003C/span\u003E\n\u003Cspan class=\"paragraph\"\u003EI should note immediately that the idea here is not to treat elections as though every voter should have a shot at being the decisive vote. I expect that this probability, even in our toy \"uniform distribution\", is going to be extremely small; even in a real election which is quite close the probabilities will be quite small; we are not trying to argue people should vote because they might have a shot at changing something.\u003C/span\u003E\n\u003Cspan class=\"paragraph\"\u003EWhat I will be interested in is the \u003Cem\u003Erelative probabilities\u003C/em\u003E--the ratio between this probability for different voters--which are a way of characterizing the election system itself.\u003C/span\u003E\n\u003Cspan class=\"paragraph\"\u003EAnd, I mention again, the point of a fair electoral system is not actually to give every voter explicit \"power\" to change the outcome, but rather to give voters \u003Cem\u003Einfluence\u003C/em\u003E of the candidates and parties: the election system itself, I believe, should not negate the influence of certain voters arbitrarily.\u003C/span\u003E\n\u003Cspan class=\"paragraph\"\u003ENow, how shall we describe \"pivotality\" mathematically?\u003C/span\u003E\n\u003Cspan class=\"paragraph\"\u003ELet us first consider a single general election among \u003Cmarimo-tex class=\"arithmatex\"\u003E||(N||)\u003C/marimo-tex\u003E voters with no states.\u003C/span\u003E\n\u003Cspan class=\"paragraph\"\u003EThe very first definition of \"pivotal\" you might reach for is this: one side or the other must cast the \u003Cmarimo-tex class=\"arithmatex\"\u003E||((\\frac{N}{2}+1)||)\u003C/marimo-tex\u003Eth vote. This voter is \"the pivotal one\". Amidst \u003Cmarimo-tex class=\"arithmatex\"\u003E||(N||)\u003C/marimo-tex\u003E voters, each is equally likely to be in the pivotal spot (I suppose we randomize over \u003Cem\u003Eorder\u003C/em\u003E) so the probability is\u003C/span\u003E\n\u003Cmarimo-tex class=\"arithmatex\"\u003E||[\nP[\\text{vote } x \\text{ is pivotal}] \\stackrel{?}{=} \\frac{1}{N}\n||]\u003C/marimo-tex\u003E\u003Cspan class=\"paragraph\"\u003EBut this is not very useful. For one, it doesn't make sense to think of the votes as occurring in any particular \u003Cem\u003Eorder\u003C/em\u003E--wouldn't every one of the winning voters be equally \"pivotal\"? Anyway, the generalization of of this notion to an electoral college is just going to be something \u003Cmarimo-tex class=\"arithmatex\"\u003E||(\\propto \\frac{1}{n_s} \\cdot \\frac{e_s}{E}||)\u003C/marimo-tex\u003E, which gives us AV again.\u003C/span\u003E\n\u003Cspan class=\"paragraph\"\u003ELet us try a narrower definition. Fix a single voter \u003Cmarimo-tex class=\"arithmatex\"\u003E||(x_i||)\u003C/marimo-tex\u003E and ask: what is the probability that exactly half of the other votes are \"1\", such that \u003Cmarimo-tex class=\"arithmatex\"\u003E||(x_i||)\u003C/marimo-tex\u003E decides the whole election? We'll depict the sum of these votes by the random variable \u003Cmarimo-tex class=\"arithmatex\"\u003E||(R^{(N-1)}||)\u003C/marimo-tex\u003E. The number of ways to realize this result is given by a binomial coefficient (with \u003Cmarimo-tex class=\"arithmatex\"\u003E||(2^{-(N-1)}||)\u003C/marimo-tex\u003E as the normalization):\u003C/span\u003E\n\u003Cmarimo-tex class=\"arithmatex\"\u003E||[\n\\begin{align}\nP[R^{(N-1)} = 0] \u0026amp;= {N - 1 \\choose \\frac{N-1}{2}}2^{-(N-1)}  \\\\\n  \u0026amp;= \\frac{(N-1)!}{(\\frac{N-1}{2})! (\\frac{N-1}{2})!}2^{-(N-1)}\n\\end{align}\n||]\u003C/marimo-tex\u003E\u003Cspan class=\"paragraph\"\u003ESince the numbers involved are large we can use a Stirling approximation to the factorial, \u003Cmarimo-tex class=\"arithmatex\"\u003E||(n! \\approx \\exp(n \\log n)||)\u003C/marimo-tex\u003E. We get:\u003C/span\u003E\n\u003Cmarimo-tex class=\"arithmatex\"\u003E||[\n\\begin{align}\n\\frac{(N-1)!}{(\\frac{N-1}{2})! (\\frac{N-1}{2})!} \u0026amp;\\approx \\exp{\\left( (N-1)\\log (N-1) - 2 \\cdot (\\frac{N-1}{2}) \\log (\\frac{N-1}{2})\\right)} \\\\\n  \u0026amp;= \\exp{\\left( (N-1)(\\log (N-1) -  \\log (\\frac{N-1}{2}))\\right)}\\\\\n  \u0026amp;= \\exp{\\left( (N-1)\\log \\frac{N-1}{(N-1)/2}\\right)}\\\\\n  \u0026amp;= \\exp{\\left( (N-1)\\log 2\\right)} \\\\\n  \u0026amp;= 2^{N-1}\n\\end{align}\n||]\u003C/marimo-tex\u003E\u003Cspan class=\"paragraph\"\u003E... oops: that Stirling approximation was \u003Cem\u003Eso\u003C/em\u003E approximate that it assigned the entire measure of the space to the single mean value. That will just cancel with the normalization, giving \u003Cmarimo-tex class=\"arithmatex\"\u003E||(P[R^{(N-1)}] = 0] = 1||)\u003C/marimo-tex\u003E.\u003C/span\u003E\n\u003Cspan class=\"paragraph\"\u003EThe two-term approximation \u003Cmarimo-tex class=\"arithmatex\"\u003E||(n! \\approx \\exp(n \\log n -n)||)\u003C/marimo-tex\u003E won't help, because the second terms of the numerator and denominator will cancel. We need a third term: \u003Cmarimo-tex class=\"arithmatex\"\u003E||(n! \\approx \\exp(n \\log n - n + \\log \\sqrt{2\\pi n})||)\u003C/marimo-tex\u003E. With that we get:\u003C/span\u003E\n\u003Cmarimo-tex class=\"arithmatex\"\u003E||[\n\\begin{align}\n\\frac{(N-1)!}{(\\frac{N-1}{2})! (\\frac{N-1}{2})!} \u0026amp;\\approx 2^{N-1} \\exp{\\left( \\log \\sqrt{2 \\pi (N-1)} - 2 \\log \\sqrt{2 \\pi \\frac{N-1}{2}}\\right)} \\\\\n\u0026amp;= 2^{N-1} \\exp{\\left( \\log \\sqrt{2 \\pi (N-1)} - \\log (\\pi (N-1))\\right)} \\\\\n\u0026amp;= 2^{N-1} \\exp{\\left( \\log \\sqrt\\frac{2}{\\pi} \\frac{\\sqrt{ N-1}}{ N-1}\\right)} \\\\\n\u0026amp; \\approx 2^{N-1}  \\sqrt\\frac{2}{\\pi}  \\frac{1}{\\sqrt{ N-1}}\\\\\n\\end{align}\n||]\u003C/marimo-tex\u003E\u003Cspan class=\"paragraph\"\u003EThe final factor \u003Cmarimo-tex class=\"arithmatex\"\u003E||(\\frac{1}{\\sqrt{ N-1}}||)\u003C/marimo-tex\u003E is what we're interested in. For large \u003Cmarimo-tex class=\"arithmatex\"\u003E||(N||)\u003C/marimo-tex\u003E this is very nearly the same as \u003Cmarimo-tex class=\"arithmatex\"\u003E||(\\frac{1}{\\sqrt{N}}||)\u003C/marimo-tex\u003E, which gives us \"scaling\" of our pivotal probability with the population size:\u003C/span\u003E\n\u003Cmarimo-tex class=\"arithmatex\"\u003E||[\n\\begin{align}\nP[\\text{vote } x \\text{ is pivotal}]  \u0026amp;\\stackrel{?}{=} P[R^{(N-1)} = 0] \\\\\n  \u0026amp;\\propto \\frac{1}{\\sqrt{N}} \\\\\n\\end{align}\n||]\u003C/marimo-tex\u003E\u003Chr /\u003E\u003C/span\u003E"}, "type": "data"}]}, {"code_hash": "cbb44a06cbc08329b7182feae1c314c3", "console": [], "id": "RGSE", "outputs": [{"data": {"text/markdown": "\u003Cspan class=\"markdown prose dark:prose-invert contents\"\u003E\u003Ch3 id=\"an-example\"\u003EAn Example\u003C/h3\u003E\n\u003Cspan class=\"paragraph\"\u003EThis result \u003Cmarimo-tex class=\"arithmatex\"\u003E||(P \\propto \\frac{1}{\\sqrt{N}}||)\u003C/marimo-tex\u003E is new to us. Let us briefly get a sense for it.\u003C/span\u003E\n\u003Cspan class=\"paragraph\"\u003EThe \u003Cmarimo-tex class=\"arithmatex\"\u003E||(\\propto||)\u003C/marimo-tex\u003E is a bit confusing: just how large \u003Cem\u003Eis\u003C/em\u003E this probability?\u003C/span\u003E\n\u003Cspan class=\"paragraph\"\u003ETake \u003Cmarimo-tex class=\"arithmatex\"\u003E||(N = 11||)\u003C/marimo-tex\u003E. The approximation above gives us \u003Cmarimo-tex class=\"arithmatex\"\u003E||({10 \\choose 5} \\approx 258.4||)\u003C/marimo-tex\u003E, very close to the true value of \u003Cmarimo-tex class=\"arithmatex\"\u003E||(252||)\u003C/marimo-tex\u003E. There are \u003Cmarimo-tex class=\"arithmatex\"\u003E||(2^{10} = 1024||)\u003C/marimo-tex\u003E possible outcomes of the first 10 voters, of which \u003Cmarimo-tex class=\"arithmatex\"\u003E||(\\frac{252}{1024} \\approx 0.246||)\u003C/marimo-tex\u003E are ties, making the 11th voter pivotal. Of the \u003Cmarimo-tex class=\"arithmatex\"\u003E||(2^{11} = 2048||)\u003C/marimo-tex\u003E total results, \u003Cmarimo-tex class=\"arithmatex\"\u003E||(252||)\u003C/marimo-tex\u003E have voter 11 voting  \"1\" and the other \u003Cmarimo-tex class=\"arithmatex\"\u003E||(252||)\u003C/marimo-tex\u003E have voter 11 voting \"0\", deciding the election in either case\u2014still approximately one-fourth of the time.\u003C/span\u003E\n\u003Cspan class=\"paragraph\"\u003ELikewise every other voter has the same probability of being pivotal. There are only \u003Cmarimo-tex class=\"arithmatex\"\u003E||(2^{11} = 2048||)\u003C/marimo-tex\u003E outcomes of the full 11-way vote, so the pivotal cases for each voter cannot all be distinct. Consider: of the 252 cases where voter 11 is pivotal, in half of those voter 11 votes \"1\" and the \"1\"s win. Each of those cases is also a pivotal case for all of the other voters who voted \"1\"; if not for their vote the election would have been tied.\u003C/span\u003E\n\u003Cspan class=\"paragraph\"\u003EOf the \u003Cmarimo-tex class=\"arithmatex\"\u003E||(2^{11} = 2048||)\u003C/marimo-tex\u003E total outcomes, how many wound up being decided by a margin of 1 in either direction? The answer should be\u003C/span\u003E\n\u003Cmarimo-tex class=\"arithmatex\"\u003E||[\n{N \\choose \\frac{N-1}{2}} + {N \\choose \\frac{N+1}{2}}\n||]\u003C/marimo-tex\u003E\u003Cspan class=\"paragraph\"\u003Ewhich in this case is \u003Cmarimo-tex class=\"arithmatex\"\u003E||(462 + 462  = 924||)\u003C/marimo-tex\u003E, or a bit less than half of the \u003Cmarimo-tex class=\"arithmatex\"\u003E||(2048||)\u003C/marimo-tex\u003E outcomes. These expressions will scale as \u003Cmarimo-tex class=\"arithmatex\"\u003E||(\\frac{1}{\\sqrt{N}}||)\u003C/marimo-tex\u003E as well, and this probabiltiy will be approximately twice that of a single voter being pivotal.\u003C/span\u003E\n\u003Cspan class=\"paragraph\"\u003EFor \u003Cmarimo-tex class=\"arithmatex\"\u003E||(N=21||)\u003C/marimo-tex\u003E, the numbers are: approximately a \u003Cmarimo-tex class=\"arithmatex\"\u003E||(0.176||)\u003C/marimo-tex\u003E probability of being pivotal, and a \u003Cmarimo-tex class=\"arithmatex\"\u003E||(0.336||)\u003C/marimo-tex\u003E probability of the election having a margin of 1. Doubling \u003Cmarimo-tex class=\"arithmatex\"\u003E||(N||)\u003C/marimo-tex\u003E reduces the probabilities by \u003Cmarimo-tex class=\"arithmatex\"\u003E||(\\sqrt{2}||)\u003C/marimo-tex\u003E, as expected.\u003C/span\u003E\n\u003Cspan class=\"paragraph\"\u003ENote that every one of the \u003Cmarimo-tex class=\"arithmatex\"\u003E||(N||)\u003C/marimo-tex\u003E voters has the same probability of being pivotal. We could create a \"value of a vote\" measure with pivotal probabilities as weights, but the \u003Cmarimo-tex class=\"arithmatex\"\u003E||(\\frac{1}{\\sqrt{N}}||)\u003C/marimo-tex\u003E would disappear when we normalize, leaving us with just \u003Cmarimo-tex class=\"arithmatex\"\u003E||(V(x) = \\frac{1}{N}||)\u003C/marimo-tex\u003E.\u003C/span\u003E\n\u003Chr /\u003E\u003C/span\u003E"}, "type": "data"}]}, {"code_hash": "62bbc95108301f6e173b41ccaeb88922", "console": [], "id": "Kclp", "outputs": [{"data": {"text/markdown": "\u003Cspan class=\"markdown prose dark:prose-invert contents\"\u003E\u003Ch3 id=\"reservations\"\u003EReservations\u003C/h3\u003E\n\u003Cspan class=\"paragraph\"\u003ENow, I have some qualms with the idea of pivotality.\u003C/span\u003E\n\u003Cspan class=\"paragraph\"\u003EFor any reasonably large \u003Cmarimo-tex class=\"arithmatex\"\u003E||(N||)\u003C/marimo-tex\u003E, only a small fraction of elections will be decided by one vote. Why should we care about this at all?\u003C/span\u003E\n\u003Cspan class=\"paragraph\"\u003EThe immediate answer is just what I said at the beginning of this section: we don't actually expect this scenario to obtain, but we consider it as characterization of the election system and of the influence of the voters on the candidates.\u003C/span\u003E\n\u003Cspan class=\"paragraph\"\u003EAs a second answer, note that we just showed that the \u003Cmarimo-tex class=\"arithmatex\"\u003E||(P \\propto \\frac{1}{\\sqrt{N}}||)\u003C/marimo-tex\u003E rule describes both the probability of a single voter being pivotal \u003Cem\u003Eand\u003C/em\u003E the probability that the election has a margin of \u003Cmarimo-tex class=\"arithmatex\"\u003E||(1||)\u003C/marimo-tex\u003E. We can actually say more: it turns out that the probability of any small margin \u003Cmarimo-tex class=\"arithmatex\"\u003E||(m||)\u003C/marimo-tex\u003E will have this same scaling. We could get an exact expression as a sum of binomials, or an approximation. For the latter we need the variance and standard deviation of our \u003Cmarimo-tex class=\"arithmatex\"\u003E||(R = \\sum_i^N X_i||)\u003C/marimo-tex\u003E variable:\u003C/span\u003E\n\u003Cmarimo-tex class=\"arithmatex\"\u003E||[\n\\begin{align}\n\\text{Var}[R] \u0026amp;= \\sum_i^N \\text{Var}[X_i] \\\\ \u0026amp;= \\frac{N}{4}\\\\\n\\text{SD}[R] \u0026amp;= \\sqrt{\\text{Var}[R] } \\\\ \u0026amp;= \\frac{\\sqrt{N}}{2}\n\\end{align}\n||]\u003C/marimo-tex\u003E\u003Cspan class=\"paragraph\"\u003EThen if we define a new random variable for the margin \u003Cmarimo-tex class=\"arithmatex\"\u003E||(M = R - \\frac{N}{2}||)\u003C/marimo-tex\u003E, it will be approximately normal in the vicinity of \u003Cmarimo-tex class=\"arithmatex\"\u003E||(0||)\u003C/marimo-tex\u003E with the same variance:\u003C/span\u003E\n\u003Cmarimo-tex class=\"arithmatex\"\u003E||[\nM \\sim \\mathcal{N}(0, \\frac{N}{4})\n||]\u003C/marimo-tex\u003E\u003Cspan class=\"paragraph\"\u003Eand the probability of the margin being less than some particular \u003Cmarimo-tex class=\"arithmatex\"\u003E||(m||)\u003C/marimo-tex\u003E can be found by linearizing the normal CDF \u003Cmarimo-tex class=\"arithmatex\"\u003E||(\\Phi(z)||)\u003C/marimo-tex\u003E around \u003Cmarimo-tex class=\"arithmatex\"\u003E||(0||)\u003C/marimo-tex\u003E, where \u003Cmarimo-tex class=\"arithmatex\"\u003E||(\\Phi(z) \\approx \\Phi(0) + \\Phi'(0) z = \\frac{1}{2} + \\frac{1}{\\sqrt{2\\pi}} z||)\u003C/marimo-tex\u003E. We standardize \u003Cmarimo-tex class=\"arithmatex\"\u003E||(m \\to z = m/\\sqrt{N/4}||)\u003C/marimo-tex\u003E and calculate:\u003C/span\u003E\n\u003Cmarimo-tex class=\"arithmatex\"\u003E||[\n\\begin{align}\nP[|M| \\le m] \u0026amp;= P\\big[|Z| \\le m / \\sqrt{N/4}\\big] \\\\\n  \u0026amp;= \\Phi\\left(\\frac{2m}{\\sqrt{N}}\\right) - \\Phi\\left(-\\frac{2m}{\\sqrt{N}}\\right) \\\\\n  \u0026amp;\\approx \\left(\\frac{1}{2} + \\frac{1}{\\sqrt{2\\pi}} \\frac{2m}{\\sqrt{N}} \\right) - \\left(\\frac{1}{2} - \\frac{1}{\\sqrt{2\\pi}} \\frac{2m}{\\sqrt{N}} \\right) \\\\\n  \u0026amp;= \\sqrt{\\frac{8}{\\pi}} \\frac{m}{\\sqrt{N}}\n\\end{align}\n||]\u003C/marimo-tex\u003E\u003Cspan class=\"paragraph\"\u003ESo the probability of the election being close at all scales as \u003Cmarimo-tex class=\"arithmatex\"\u003E||(\\frac{1}{\\sqrt{N}}||)\u003C/marimo-tex\u003E as well. (Only under our completely-random model\u2014real elections do not fit this model at all!)\u003C/span\u003E\n\u003Cspan class=\"paragraph\"\u003EIt feels likely at this point that many \"reasonable\" definitions of the power of a votes will reproduce the \u003Cmarimo-tex class=\"arithmatex\"\u003E||(\\frac{1}{\\sqrt{N}}||)\u003C/marimo-tex\u003E scaling. Here I wonder if there might be others which are more palatable than either \"probability of being pivotal\" or \"probability of the election being close\".\u003C/span\u003E\n\u003Cspan class=\"paragraph\"\u003EI still have a reservation along the lines of: what if you have additional information that the election \u003Cem\u003Eisn't\u003C/em\u003E close? Logically, does this measure of pivotality just cease to mean anything? How do we handle this? One answer might be that all information you could have is probabilistic, and the probability of a close election never goes to \u003Cem\u003Ezero\u003C/em\u003E (considering unforeseeable rare events that might come up before the moment your vote is cast, unreliability of information, etc); there should still be some pivot probability which can be compared, even if it's low. We'll punt on taking this further for now. Here I think of calculating the pivot probability over a different distribution based on historical party shares or something. This would be viable as a metric!\u003C/span\u003E\u003C/span\u003E"}, "type": "data"}]}, {"code_hash": "7e8c90f6041cd250ef0b0943042b7a47", "console": [], "id": "emfo", "outputs": [{"data": {"text/markdown": "\u003Cspan class=\"markdown prose dark:prose-invert contents\"\u003E\u003Ch2 id=\"pivotality-in-two-tiered-elections\"\u003EPivotality in Two-Tiered Elections\u003C/h2\u003E\u003C/span\u003E"}, "type": "data"}]}, {"code_hash": "41ea2ca022fa3d83e94430fd82a3ca84", "console": [], "id": "Hstk", "outputs": [{"data": {"text/markdown": "\u003Cspan class=\"markdown prose dark:prose-invert contents\"\u003E\u003Cspan class=\"paragraph\"\u003ELet's move on to a two-tier electoral-college system.\u003C/span\u003E\n\u003Cspan class=\"paragraph\"\u003EObviously in a single-tiered system every voter had an \u003Cem\u003Eequal\u003C/em\u003E probability of being pivotal.\u003C/span\u003E\n\u003Cspan class=\"paragraph\"\u003EIf we imagine a two-tiered system where every state gets just one vote, the probability of a voter being pivotal \u003Cem\u003Enationally\u003C/em\u003E would obviously be:\u003C/span\u003E\n\u003Cmarimo-tex class=\"arithmatex\"\u003E||[\n\\begin{align}\nP[\\text{vote } x \\text{ is pivotal nationally}] \u0026amp;= P[\\text{vote } x \\text{ is pivotal in state } s(x)] \\\\\n\u0026amp; \\quad\\quad\\times P[\\text{state } s(x) \\text{ is pivotal nationally}] \\\\\n  \u0026amp;\\propto \\frac{1}{\\sqrt{n_{s(x)}}} \\times \\frac{1}{\\sqrt{N}}\n\\end{align}\n||]\u003C/marimo-tex\u003E\u003Cspan class=\"paragraph\"\u003EThis immediately suggests itself as a \"value of a vote\": we can measure the relative weights of votes \u003Cmarimo-tex class=\"arithmatex\"\u003E||(x, y||)\u003C/marimo-tex\u003E as\u003C/span\u003E\n\u003Cmarimo-tex class=\"arithmatex\"\u003E||[\n\\frac{V(x)}{V(y)} = \\frac{1 / \\sqrt{n_{s(x)}}}{1 / \\sqrt{n_{s(y)}}}\n||]\u003C/marimo-tex\u003E\u003Cspan class=\"paragraph\"\u003Ethough we still need to figure out how to handle the electoral college. Note, though, that if we normalized these values, the resulting \u003Cmarimo-tex class=\"arithmatex\"\u003E||(V(x)||)\u003C/marimo-tex\u003E would \u003Cem\u003Enot\u003C/em\u003E admit an interpretation as \"probability vote \u003Cmarimo-tex class=\"arithmatex\"\u003E||(x||)\u003C/marimo-tex\u003E is pivotal\" rather than any other vote: the pivotal scenarios for different voters are \u003Cem\u003Enot distinct from each other\u003C/em\u003E; they are probabilities over a different set of events (the election sans that single voter). The value \u003Cmarimo-tex class=\"arithmatex\"\u003E||(V(x)||)\u003C/marimo-tex\u003E might be useful, but it cannot simply be interpreted as a probability.\u003C/span\u003E\n\u003Cspan class=\"paragraph\"\u003EHow to add the elector counts \u003Cmarimo-tex class=\"arithmatex\"\u003E||(e_s||)\u003C/marimo-tex\u003E to the picture? The second factor in \u003Cmarimo-tex class=\"arithmatex\"\u003E||(\\frac{1}{\\sqrt{n_{s(x)}}} \\times \\frac{1}{\\sqrt{N}}||)\u003C/marimo-tex\u003E should incorporate this somehow.\u003C/span\u003E\n\u003Cspan class=\"paragraph\"\u003EWe now need to think about how pivotality should work in a \"weighted\" elections. The obvious generalization is this: given a uniform distribution on the results of all \u003Cem\u003Estates\u003C/em\u003E, what is the probability that the states except for some \u003Cmarimo-tex class=\"arithmatex\"\u003E||(i||)\u003C/marimo-tex\u003E result in a total number of \"1\" votes which falls within \u003Cmarimo-tex class=\"arithmatex\"\u003E||(e_i||)\u003C/marimo-tex\u003E of a tie? That is\u003C/span\u003E\n\u003Cmarimo-tex class=\"arithmatex\"\u003E||[\n\\sum_{s \\ne i} e_s X_s \\in \\frac{E - 1}{2} - \\left[0, e_i\\right]\n||]\u003C/marimo-tex\u003E\u003Cspan class=\"paragraph\"\u003EThe problem is that the states all have uneven numbers of electors. The problem of finding the number of outcomes falling in the above interval is an integer partition problem, and the resulting probability is called the \u003Ca href=\"https://en.wikipedia.org/wiki/Banzhaf_power_index\" rel=\"noopener noreferrer\" target=\"_blank\"\u003EBanzhaf Power Index\u003C/a\u003E.\u003C/span\u003E\n\u003Cspan class=\"paragraph\"\u003EBut let us suppose that the individual states elector counts \u003Cmarimo-tex class=\"arithmatex\"\u003E||(e_s||)\u003C/marimo-tex\u003E are small enough, relative to their total \u003Cmarimo-tex class=\"arithmatex\"\u003E||(E||)\u003C/marimo-tex\u003E, that the result may be approximated with the Central Limit Theorem. Let \u003Cmarimo-tex class=\"arithmatex\"\u003E||(Y = \\sum_{s \\ne i} e_s X_s||)\u003C/marimo-tex\u003E, with each \u003Cmarimo-tex class=\"arithmatex\"\u003E||(X_s \\sim \\text{uniform}[\\{0, 1\\}]||)\u003C/marimo-tex\u003E. Each \u003Cmarimo-tex class=\"arithmatex\"\u003E||(X_s||)\u003C/marimo-tex\u003E has mean \u003Cmarimo-tex class=\"arithmatex\"\u003E||(\\mu = 0.5||)\u003C/marimo-tex\u003E and variance \u003Cmarimo-tex class=\"arithmatex\"\u003E||(\\sigma^2_{X_s} = \\frac{1}{4}||)\u003C/marimo-tex\u003E. Then:\u003C/span\u003E\n\u003Cmarimo-tex class=\"arithmatex\"\u003E||[\n\\begin{align}\n\\mu_{Y} \u0026amp;= \\frac{E - e_i}{2} \\\\\n\\sigma^2_{Y} \u0026amp;= \\sum_{s \\ne i} {(e_s)}^2 \\sigma^2_{X_s} \\\\\n  \u0026amp;= \\frac{1}{4} \\sum_{s \\ne i} {(e_s)}^2 \\\\\n\\end{align}\n||]\u003C/marimo-tex\u003E\u003Cspan class=\"paragraph\"\u003EBy the Central Limit Theorem, \u003Cmarimo-tex class=\"arithmatex\"\u003E||(Y||)\u003C/marimo-tex\u003E is approximately distributed as\u003C/span\u003E\n\u003Cmarimo-tex class=\"arithmatex\"\u003E||[\nY \\sim \\frac{1}{\\sqrt{2\\pi \\sigma^2_{Y}}} \\exp{\\left( -\\frac{(y - \\mu_Y)^2}{2\\sigma^2_{Y}}\\right)}\n||]\u003C/marimo-tex\u003E\u003Cspan class=\"paragraph\"\u003EThe probability of the result landing in the range \u003Cmarimo-tex class=\"arithmatex\"\u003E||([\\frac{E}{2} - e_i, \\frac{E}{2}]||)\u003C/marimo-tex\u003E, rounding because we're taking \u003Cmarimo-tex class=\"arithmatex\"\u003E||(E||)\u003C/marimo-tex\u003E large anyway, is:\u003C/span\u003E\n\u003Cmarimo-tex class=\"arithmatex\"\u003E||[\nP[\\text{state } i \\text{ is pivotal}] \\approx \\int_{\\frac{E}{2} - e_i}^{\\frac{E}{2}} \\frac{1}{\\sqrt{2\\pi \\sigma^2_{Y}}} \\exp{\\left( -\\frac{(y - \\mu_Y)^2}{2\\sigma^2_{Y}}\\right)} dy\n||]\u003C/marimo-tex\u003E\u003Cspan class=\"paragraph\"\u003Eand then we can take a further approximation that the Normal is approximately flat in the vicinity of its mean, meaning that the above is:\u003C/span\u003E\n\u003Cmarimo-tex class=\"arithmatex\"\u003E||[\n\\begin{align}\nP[\\text{state } i \\text{ is pivotal}] \u0026amp;\\approx \\frac{e_i}{\\sqrt{2\\pi \\sigma^2_{Y}}}  \\\\\n  \u0026amp;\\approx \\frac{e_i}{\\sqrt{2\\pi \\cdot \\frac{1}{4} \\sum_{s \\ne i} {(e_s)}^2}} \\\\\n  \u0026amp;\\approx \\sqrt{\\frac{2}{\\pi}} \\frac{e_i}{\\sqrt{\\sum_{s \\ne i} {(e_s)}^2}} \\\\\n\\end{align}\n||]\u003C/marimo-tex\u003E\u003Cspan class=\"paragraph\"\u003EThe overall result for our \"probability of a voter being pivotal\" is\u003C/span\u003E\n\u003Cmarimo-tex class=\"arithmatex\"\u003E||[\nP[x \\text{ pivotal}] \\propto \\frac{1}{\\sqrt{n_{s(x)}}} \\times \\frac{e_{s(x)}}{\\sqrt{\\sum_{s \\ne i} {(e_s)}^2}}\n||]\u003C/marimo-tex\u003E\u003Cspan class=\"paragraph\"\u003EThis is definitely something we can work with!\u003C/span\u003E\n\u003Cspan class=\"paragraph\"\u003EIf we write \u003Cmarimo-tex class=\"arithmatex\"\u003E||(\\Vert \\mathbf{e} \\Vert = \\sqrt{\\sum_{s} {(e_s)}^2}||)\u003C/marimo-tex\u003E, where \u003Cmarimo-tex class=\"arithmatex\"\u003E||(\\mathbf{e} = (e_1, \\ldots, e_S)||)\u003C/marimo-tex\u003E is the vector of elector counts, we can then express the above as\u003C/span\u003E\n\u003Cmarimo-tex class=\"arithmatex\"\u003E||[\nP[x \\text{ pivotal}] \\propto \\frac{1}{\\sqrt{n_{s(x)}}} \\times \\frac{e_{s(x)}}{\\sqrt{\\Vert \\mathbf{e} \\Vert^2 - (e_{s(x)})^2}}\n||]\u003C/marimo-tex\u003E\u003Cspan class=\"paragraph\"\u003EWe could simplify this a little more removing the restriction \u003Cmarimo-tex class=\"arithmatex\"\u003E||(s \\ne  i||)\u003C/marimo-tex\u003E from the sum; this shouldn't change the relative sizes of the probabilities very much. We then get:\u003C/span\u003E\n\u003Cmarimo-tex class=\"arithmatex\"\u003E||[\nP[x \\text{ pivotal}] \\propto \\frac{1}{\\sqrt{n_{s(x)}}} \\times \\frac{e_{s(x)}}{\\Vert \\mathbf{e} \\Vert}\n||]\u003C/marimo-tex\u003E\u003Cspan class=\"paragraph\"\u003ETo create a value-of-a-vote function, we need to normalize this quantity to sum to \u003Cmarimo-tex class=\"arithmatex\"\u003E||(N||)\u003C/marimo-tex\u003E across all voters. Its current sum is:\u003C/span\u003E\n\u003Cmarimo-tex class=\"arithmatex\"\u003E||[\n\\sum_x \\frac{e_s}{ \\Vert \\mathbf{e} \\Vert\\sqrt{n_s}}\n= \\frac{1}{\\Vert \\mathbf{e} \\Vert} \\cdot \\sum_s n_s \\cdot \\frac{e_s}{\\sqrt{n_s}}\n= \\frac{1}{\\Vert \\mathbf{e} \\Vert} \\cdot \\sum_s e_s \\sqrt{n_s}\n||]\u003C/marimo-tex\u003E\u003Cspan class=\"paragraph\"\u003ERenormalizing to \u003Cmarimo-tex class=\"arithmatex\"\u003E||(N||)\u003C/marimo-tex\u003E, we get a function we'll call the \"\u003Cstrong\u003EPivotality Value\u003C/strong\u003E\", or \"PV\":\u003C/span\u003E\n\u003Cmarimo-tex class=\"arithmatex\"\u003E||[\n\\begin{align}\n\\text{PV}(x) \u0026amp;= N \\cdot \\frac{ \\frac{e_{s(x)}}{ \\Vert \\mathbf{e} \\Vert\\sqrt{n_{s(x)}}}}{\\frac{1}{\\Vert \\mathbf{e} \\Vert} \\cdot \\sum_s e_s \\sqrt{n_s}} \\\\\n  \u0026amp;= \\frac{ N \\cdot e_{s(x)} / \\sqrt{n_{s(x)}}}{ \\sum_s e_s \\sqrt{n_s}} \\\\\n  \u0026amp;= \\frac{ e_{s(x)} \\sqrt{n_{s(x)}} / \\sum_s e_s \\sqrt{n_s}}{n_s / N} \\\\\n\\end{align}\n||]\u003C/marimo-tex\u003E\u003Cspan class=\"paragraph\"\u003EIn the last line I've written the expression in a style reminiscent of Apportionment Value \u003Cmarimo-tex class=\"arithmatex\"\u003E||(\\frac{e_s / E}{n_s / N}||)\u003C/marimo-tex\u003E. The only difference is that the \u003Cmarimo-tex class=\"arithmatex\"\u003E||(e_s||)\u003C/marimo-tex\u003E terms are replaced by \u003Cmarimo-tex class=\"arithmatex\"\u003E||(e_{s} \\sqrt{n_{s}}||)\u003C/marimo-tex\u003E\u003C/span\u003E\n\u003Cspan class=\"paragraph\"\u003ELet us briefly enumerate the approximations that went into this calculation.\u003C/span\u003E\n\u003Col\u003E\n\u003Cli\u003EWe replaced the sum \u003Cmarimo-tex class=\"arithmatex\"\u003E||(\\sum_{s \\ne i} e_s X_s||)\u003C/marimo-tex\u003E by a normal approximation, via the CLT.\u003C/li\u003E\n\u003Cli\u003EThen we approximated the normal as flat to compute the probability in a range \u003Cmarimo-tex class=\"arithmatex\"\u003E||(e_s||)\u003C/marimo-tex\u003E below its mean.\u003C/li\u003E\n\u003Cli\u003EThen we dropped the condition \u003Cmarimo-tex class=\"arithmatex\"\u003E||(s \\ne i||)\u003C/marimo-tex\u003E from the normal's variance.\u003C/li\u003E\n\u003C/ol\u003E\n\u003Cspan class=\"paragraph\"\u003EWhen we actually calculate these measures we may prefer not to approximate so much. The 2nd and 3rd  approximations should be easy to undo; the first becomes a complicated integer partition problem and is probably better left as is.\u003C/span\u003E\n\u003Cspan class=\"paragraph\"\u003ETODO: consider redoing the derivation with votes \u003Cmarimo-tex class=\"arithmatex\"\u003E||(\\pm 1||)\u003C/marimo-tex\u003E and mean \u003Cmarimo-tex class=\"arithmatex\"\u003E||(0||)\u003C/marimo-tex\u003E, for clarity.\u003C/span\u003E\n\u003Cspan class=\"paragraph\"\u003ETODO: fit a regression to \u003Cmarimo-tex class=\"arithmatex\"\u003E||(e_s||)\u003C/marimo-tex\u003E vs \u003Cmarimo-tex class=\"arithmatex\"\u003E||(n_s||)\u003C/marimo-tex\u003E and work out the effective benefit for large districts...\u003C/span\u003E\n\u003Chr /\u003E\u003C/span\u003E"}, "type": "data"}]}, {"code_hash": "c9f9481aefe832d4bb2b06c708d0c1ae", "console": [], "id": "nWHF", "outputs": [{"data": {"text/markdown": "\u003Cspan class=\"markdown prose dark:prose-invert contents\"\u003E\u003Ch2 id=\"visualizationing-pv\"\u003EVisualizationing PV\u003C/h2\u003E\u003C/span\u003E"}, "type": "data"}]}, {"code_hash": "02ea18987f58ca7a52b6b6eb1c55cbb9", "console": [], "id": "iLit", "outputs": [{"data": {"text/html": "\u003Cmarimo-ui-element object-id='iLit-0' value\",\n        \"format\": \".3f\",\n        \"title\": \"Pivotality Value\",\n        \"type\": \"quantitative\"\n      },\n      {\n        \"field\": \"apportionment_value\",\n        \"format\": \".3f\",\n        \"title\": \"Apportionment Value (AV)\",\n        \"type\": \"quantitative\"\n      }\n    ],\n    \"x\": {\n      \"field\": \"pivotality_value\",\n      \"title\": \"Pivotality Value\",\n      \"type\": \"quantitative\"\n    },\n    \"y\": {\n      \"field\": \"apportionment_value\",\n      \"title\": \"Apportionment Value (AV)\",\n      \"type\": \"quantitative\"\n    }\n  },\n  \"height\": 400,\n  \"mark\": {\n    \"size\": 100,\n    \"type\": \"circle\"\n  },\n  \"title\": \"Pivotality Value vs. Apportionment Value (AV) by State - 2024 Presidential Election\",\n  \"usermeta\": {\n    \"embedOptions\": {}\n  },\n  \"width\": 400\n}"}, "type": "data"}]}, {"code_hash": "3442fa3f5d54a4dab204e44cc0514dd8", "console": [], "id": "Pvdt", "outputs": [{"data": {"text/markdown": "\u003Cspan class=\"markdown prose dark:prose-invert contents\"\u003E\u003Cspan class=\"paragraph\"\u003EHuh, what is that functional form?\u003C/span\u003E\n\u003Cmarimo-tex class=\"arithmatex\"\u003E||[\n\\begin{align}\n\\text{AV}(x) \\propto \\frac{e_{s(x)}}{n_{s(x)}} \u0026amp;\u0026amp; \u0026amp;\u0026amp; \u0026amp;\u0026amp; \\text{PV}(x) \\propto \\frac{e_{s(x)}}{\\sqrt{n_{s(x)}}}\n\\end{align}\n||]\u003C/marimo-tex\u003E\u003Cspan class=\"paragraph\"\u003EFor large \u003Cmarimo-tex class=\"arithmatex\"\u003E||(n_s||)\u003C/marimo-tex\u003E we should have \u003Cmarimo-tex class=\"arithmatex\"\u003E||(e_{s(x)} \\propto n_{s(x)}||)\u003C/marimo-tex\u003E and so \u003Cmarimo-tex class=\"arithmatex\"\u003E||(\\text{AV}(x) \\propto 1||)\u003C/marimo-tex\u003E and \u003Cmarimo-tex class=\"arithmatex\"\u003E||(\\text{PV}(x) \\propto \\sqrt{n_{s(x)}}||)\u003C/marimo-tex\u003E. The large states form the constant horizontal asymptote.\u003C/span\u003E\n\u003Cspan class=\"paragraph\"\u003EFor small \u003Cmarimo-tex class=\"arithmatex\"\u003E||(n_s||)\u003C/marimo-tex\u003E we have \u003Cmarimo-tex class=\"arithmatex\"\u003E||(e_{s(x)} = 3||)\u003C/marimo-tex\u003E, so \u003Cmarimo-tex class=\"arithmatex\"\u003E||(\\text{AV}(x) \\propto \\frac{1}{n_{s(x)}}||)\u003C/marimo-tex\u003E while \u003Cmarimo-tex class=\"arithmatex\"\u003E||(\\text{PV}(x) \\propto \\frac{1}{\\sqrt{n_{s(x)}}}||)\u003C/marimo-tex\u003E. Hence \u003Cmarimo-tex class=\"arithmatex\"\u003E||(\\text{AV}(x) \\propto (\\text{PV}(x))^2||)\u003C/marimo-tex\u003E for small states, which I suppose makes the vertical portion of our graph act like one tail of a parabola.\u003C/span\u003E\u003C/span\u003E"}, "type": "data"}]}, {"code_hash": "6203d7a4b7e82fa778234d69989b8770", "console": [], "id": "ZBYS", "outputs": [{"data": {"text/markdown": "\u003Cspan class=\"markdown prose dark:prose-invert contents\"\u003E\u003Ch1 id=\"m2-pivotality-value-inequality\"\u003E\u003Cstrong\u003EM2\u003C/strong\u003E: Pivotality Value Inequality\u003C/h1\u003E\u003C/span\u003E"}, "type": "data"}]}, {"code_hash": "a0b8ab6ad7c09281faa9039c1027da70", "console": [], "id": "aLJB", "outputs": [{"data": {"text/markdown": "\u003Cspan class=\"markdown prose dark:prose-invert contents\"\u003E\u003Cspan class=\"paragraph\"\u003ELet's write out exact expressions for the MAD, Variance, and Entropy of our Pivotality measures, mainly just to see if the expressions happen to simplify nicely. In each case these expressions apply to election scenario P2 only.\u003C/span\u003E\n\u003Cspan class=\"paragraph\"\u003ETo simplify the expressions we'll write the denominator as \u003Cmarimo-tex class=\"arithmatex\"\u003E||(Z = \\sum_{s} e_{s} \\sqrt{n_{s}}||)\u003C/marimo-tex\u003E. Our PV function is then written \u003Cmarimo-tex class=\"arithmatex\"\u003E||(\\text{PV}(x) = \\frac{ e_{s(x)} \\sqrt{n_{s(x)}} / Z}{n_s / N}||)\u003C/marimo-tex\u003E\u003C/span\u003E\n\u003Cspan class=\"paragraph\"\u003E\u003Cstrong\u003EM2.1\u003C/strong\u003E Mean absolute deviation (MAD):\u003C/span\u003E\n\u003Cmarimo-tex class=\"arithmatex\"\u003E||[\n\\begin{align}\n\\text{PVI}_{\\text{MAD}}[\\text{P2}] \u0026amp;= \\frac{1}{N}\\sum_s n_s \\vert\\text{AV(s)} - 1 \\vert \\\\\n  \u0026amp;= \\frac{1}{N}\\sum_s n_s \\left\\vert \\frac{ e_{s} \\sqrt{n_{s}} / Z}{n_s / N} - 1 \\right\\vert \\\\\n  \u0026amp;= \\sum_s \\left\\vert \\frac{e_{s} \\sqrt{n_{s}}}{Z} - \\frac{n_s}{N} \\right\\vert \\\\\n\\end{align}\n||]\u003C/marimo-tex\u003E\u003Cspan class=\"paragraph\"\u003EWe get the average difference between the state's share of the national \u003Cmarimo-tex class=\"arithmatex\"\u003E||(e_{s}\\sqrt{n_{s}}||)\u003C/marimo-tex\u003E and its share of \u003Cmarimo-tex class=\"arithmatex\"\u003E||(n_s||)\u003C/marimo-tex\u003E alone.\u003C/span\u003E\n\u003Cspan class=\"paragraph\"\u003E\u003Cstrong\u003EM2.2\u003C/strong\u003E Variance:\u003C/span\u003E\n\u003Cmarimo-tex class=\"arithmatex\"\u003E||[\n\\begin{align}\n\\text{PVI}_{\\text{Var}}[\\text{P2}]  \u0026amp;= \\sum_s \\frac{n_s}{N} \\left(\\text{PV(s)}\\right)^2  - 1 \\\\\n  \u0026amp;= \\sum_s \\frac{n_s}{N} \\left(\\frac{ e_{s} \\sqrt{n_{s}} / Z}{n_s / N} \\right)^2  - 1 \\\\\n  \u0026amp;= \\frac{N}{Z^2} \\sum_s \\left( e_{s} \\right)^2  - 1\n\\end{align}\n||]\u003C/marimo-tex\u003E\u003Cspan class=\"paragraph\"\u003E\u003Cstrong\u003EM2.3\u003C/strong\u003E Relative Entropy with respect to a popular election:\u003C/span\u003E\n\u003Cmarimo-tex class=\"arithmatex\"\u003E||[\n\\begin{align}\n\\text{PVI}_{\\text{Ent}}[\\text{P2}]  = H\\left[\\frac{\\text{PV}(x)}{N} ~\\Vert~ \\frac{1}{N}\\right]\n  \u0026amp;= \\frac{1}{N}\\sum_s n_s \\cdot \\text{PV}(s) \\cdot \\log \\text{PV}(s) \\\\\n  \u0026amp;= \\frac{1}{N}\\sum_s n_s \\cdot \\frac{ e_{s} \\sqrt{n_{s}} / Z}{n_s / N} \\cdot \\log \\frac{ e_{s} \\sqrt{n_{s}} / Z}{n_s / N} \\\\\n  \u0026amp;= \\sum_s \\frac{e_{s} \\sqrt{n_{s}}}{Z} \\cdot \\log \\frac{ e_{s} \\sqrt{n_{s}} / Z}{n_s / N} \\\\\n  \u0026amp;= H\\left[\\frac{e_{s} \\sqrt{n_{s}}}{Z} ~\\Vert~ \\frac{n_s}{N}\\right]\n\\end{align}\n||]\u003C/marimo-tex\u003E\u003Cspan class=\"paragraph\"\u003EOnce again we get that the relative entropy over all \u003Cmarimo-tex class=\"arithmatex\"\u003E||(x||)\u003C/marimo-tex\u003E corresponds to a different relative entropy over the states alone.\u003C/span\u003E\n\u003Cspan class=\"paragraph\"\u003EInterestingly, these measures would all cancel perfectly if \u003Cmarimo-tex class=\"arithmatex\"\u003E||(e_s \\propto \\sqrt{n_s}||)\u003C/marimo-tex\u003E exactly.\u003C/span\u003E\u003C/span\u003E"}, "type": "data"}]}, {"code_hash": "6d8ac72a109024e7ab3f6ad586592200", "console": [], "id": "nHfw", "outputs": [{"data": {"application/vnd.vegalite.v6+json": "{\n  \"$schema\": \"https://vega.github.io/schema/vega-lite/v6.1.0.json\",\n  \"config\": {\n    \"view\": {\n      \"continuousHeight\": 300,\n      \"continuousWidth\": 300\n    }\n  },\n  \"data\": {\n    \"name\": \"data-71e5afdc9f0f24c54e37b9209871efb5\"\n  },\n  \"datasets\": {\n    \"data-71e5afdc9f0f24c54e37b9209871efb5\": [\n      {\n        \"MAD\": null,\n        \"Relative_Entropy\": null,\n        \"Var\": null,\n        \"winning_party\": \"democrat\",\n        \"year\": 1976\n      },\n      {\n        \"MAD\": 0.2501174258996203,\n        \"Relative_Entropy\": 0.04561167244637735,\n        \"Var\": 0.08421794931253271,\n        \"winning_party\": \"republican\",\n        \"year\": 1980\n      },\n      {\n        \"MAD\": 0.2507737290466426,\n        \"Relative_Entropy\": 0.045954861523971775,\n        \"Var\": 0.08399009928310003,\n        \"winning_party\": \"republican\",\n        \"year\": 1984\n      },\n      {\n        \"MAD\": 0.2523977930722525,\n        \"Relative_Entropy\": 0.04613074785472819,\n        \"Var\": 0.08316412071919978,\n        \"winning_party\": \"republican\",\n        \"year\": 1988\n      },\n      {\n        \"MAD\": 0.2779276531701502,\n        \"Relative_Entropy\": 0.0721284
