      function __resizeIframe(obj) {
        const scrollbarHeight = 20; // Max between windows, mac, and linux

        function setHeight() {
          // Guard against race condition where iframe isn't ready
          if (!obj.contentWindow?.document?.documentElement) {
            return;
          }
          const element = obj.contentWindow.document.documentElement;
          // If there is no vertical scrollbar, we don't need to resize the iframe
          if (element.scrollHeight === element.clientHeight) {
            return;
          }

          // Create a new height that includes the scrollbar height if it's visible
          const hasHorizontalScrollbar = element.scrollWidth > element.clientWidth;
          const newHeight = element.scrollHeight + (hasHorizontalScrollbar ? scrollbarHeight : 0);

          // Only update the height if it's different from the current height
          if (obj.style.height !== `${newHeight}px`) {
            obj.style.height = `${newHeight}px`;
          }
        }

        // Resize the iframe to the height of the content and bottom scrollbar height
        setHeight();

        // Resize the iframe when the content changes
        const resizeObserver = new ResizeObserver((_entries) => {
          setHeight();
        });
        // Only observe if iframe content is ready
        if (obj.contentWindow?.document?.body) {
          resizeObserver.observe(obj.contentWindow.document.body);
        }
      }
    </script>

disabled": false, "hide_code": false}, "id": "ZBYS", "name": "_"}], "metadata": {"marimo_version": "0.19.6"}, "version": "1"},
            "session": {"cells": [{"code_hash": "652c4631bb8a71e02b4ba959834632ac", "console": [], "id": "setup", "outputs": [{"data": {"text/plain": ""}, "type": "data"}]}, {"code_hash": "b2581a205ce6390b6f48d7bf7b5a72c6", "console": [], "id": "Hbol", "outputs": [{"data": {"text/markdown": "\u003Cspan class=\"markdown prose dark:prose-invert contents\"\u003E\u003Ch1 id=\"v1-apportionment-value\"\u003E\u003Cstrong\u003EV1\u003C/strong\u003E: Apportionment Value\u003C/h1\u003E\u003C/span\u003E"}, "type": "data"}]}, {"code_hash": "80e60890201eac4e48fafb0e8a294b5c", "console": [], "id": "MJUe", "outputs": [{"data": {"text/markdown": "\u003Cspan class=\"markdown prose dark:prose-invert contents\"\u003E\u003Cspan class=\"paragraph\"\u003EWe target L2.1, apportionment. We will limit our attention to the presidential election.\u003C/span\u003E\n\u003Cspan class=\"paragraph\"\u003EWe will attempt to devise a measure which is a function of the population and elector accounts \u003Cem\u003Ealone\u003C/em\u003E, i.e. ignoring all dynamical effects of the election system on turnout, candidates, etc.\u003C/span\u003E\n\u003Cspan class=\"paragraph\"\u003EImagine first a simple election between two candidates where voter \u003Cmarimo-tex class=\"arithmatex\"\u003E||(x||)\u003C/marimo-tex\u003E has some weight \u003Cmarimo-tex class=\"arithmatex\"\u003E||(w_x||)\u003C/marimo-tex\u003E. Obviously, in this case, the most natural \"value of a vote\" is exactly its weight\u003C/span\u003E\n\u003Cmarimo-tex class=\"arithmatex\"\u003E||[\nV(x) = w_x\n||]\u003C/marimo-tex\u003E\u003Cspan class=\"paragraph\"\u003EIn our two-tiered electoral-college system, it is as if the states were each casting votes with weights \u003Cmarimo-tex class=\"arithmatex\"\u003E||(e_s||)\u003C/marimo-tex\u003E in a single election. In that election the value of the states' votes is:\u003C/span\u003E\n\u003Cmarimo-tex class=\"arithmatex\"\u003E||[\nV_{\\text{states}}(s) = e_s\n||]\u003C/marimo-tex\u003E\u003Cspan class=\"paragraph\"\u003ENow, what value should we assign to the voters \u003Cem\u003Ein\u003C/em\u003E the state, if the state assigns all of its electors to its winner?\u003C/span\u003E\n\u003Cspan class=\"paragraph\"\u003EThe simplest thing to do is to simply divide the state's electors among its population \u003Cmarimo-tex class=\"arithmatex\"\u003E||(n_s||)\u003C/marimo-tex\u003E:\u003C/span\u003E\n\u003Cmarimo-tex class=\"arithmatex\"\u003E||[\nV(x) \\stackrel{?}{=} \\frac{e_{s(x)}}{n_{s(x)}}\n||]\u003C/marimo-tex\u003E\u003Cspan class=\"paragraph\"\u003E(Here \u003Cmarimo-tex class=\"arithmatex\"\u003E||(n_{s(x)}||)\u003C/marimo-tex\u003E is probably best taken to be the \"apportionment population\" AP, i.e. the population which was used to determine the elector count \u003Cmarimo-tex class=\"arithmatex\"\u003E||(e_s||)\u003C/marimo-tex\u003E in the first place.)\u003C/span\u003E\n\u003Cspan class=\"paragraph\"\u003EIt will be more natural to scale this definition so that the sum of all voters across all states is \u003Cmarimo-tex class=\"arithmatex\"\u003E||(N||)\u003C/marimo-tex\u003E, and the mean \"value of a vote\" is \u003Cmarimo-tex class=\"arithmatex\"\u003E||(1||)\u003C/marimo-tex\u003E. (This will allow us to compare this voting system to others which do not involve the arbitrary total elector count \u003Cmarimo-tex class=\"arithmatex\"\u003E||(E = \\sum_s e_s||)\u003C/marimo-tex\u003E.) The sum of the above over all voters is\u003C/span\u003E\n\u003Cmarimo-tex class=\"arithmatex\"\u003E||[\n\\begin{align}\n\\sum_x V(x) \u0026amp;= \\sum_x \\frac{e_{s(x)}}{n_{s(x)}}\\\\\n  \u0026amp;= \\sum_{s \\in S} n_s \\frac{e_{s}}{n_{s}} \\\\\n  \u0026amp;= \\sum_{s \\in S} e_s \\\\\n  \u0026amp;= E\n\\end{align}\n||]\u003C/marimo-tex\u003E\u003Cspan class=\"paragraph\"\u003ETherefore we should scale the above by \u003Cmarimo-tex class=\"arithmatex\"\u003E||(\\frac{N}{E}||)\u003C/marimo-tex\u003E such that \u003Cmarimo-tex class=\"arithmatex\"\u003E||(\\sum_{x} V(x) = N||)\u003C/marimo-tex\u003E:\u003C/span\u003E\n\u003Cmarimo-tex class=\"arithmatex\"\u003E||[\n\\begin{align}\nV(x) \u0026amp;= \\frac{e_{s(x)}}{n_{s(x)}} \\cdot \\frac{N}{E}\n\\end{align}\n||]\u003C/marimo-tex\u003E\u003Cspan class=\"paragraph\"\u003EThis will be our first definition of a value-of-a-vote, which we will call the \u003Cstrong\u003EApportionment Value\u003C/strong\u003E or AV:\u003C/span\u003E\n\u003Cmarimo-tex class=\"arithmatex\"\u003E||[\n\\text{AV}(x) \\equiv \\frac{e_{s(x)}}{n_{s(x)}} \\cdot \\frac{N}{E}\n||]\u003C/marimo-tex\u003E\u003Chr /\u003E\u003C/span\u003E"}, "type": "data"}]}, {"code_hash": "252b1724c707ec34363377a0011e2d63", "console": [], "id": "vblA", "outputs": [{"data": {"text/markdown": "\u003Cspan class=\"markdown prose dark:prose-invert contents\"\u003E\u003Cspan class=\"paragraph\"\u003EWe can express the Apportionment Value in three ways:\u003C/span\u003E\n\u003Cmarimo-tex class=\"arithmatex\"\u003E||[\n\\begin{align}\n\\text{AV(x)} \u0026amp;\\equiv \\frac{e_{s(x)}}{n_{s(x)}} \\cdot \\frac{N}{E}  \\\\\n \u0026amp;= \\frac{e_{s(x)} / E}{n_{s(x)} / N} \\\\\n \u0026amp;= \\frac{e_{s(x)} / n_{s(x)}}{E / N}\n\\end{align}\n||]\u003C/marimo-tex\u003E\u003Cspan class=\"paragraph\"\u003EThe second expression expresses this value-of-a-vote as a ratio between this state's \"fraction of the electoral college\" and its \"fraction of the total population\".\u003C/span\u003E\n\u003Cspan class=\"paragraph\"\u003EThe third expression expresses it as a ratio between the \"electors per capita\" and the national mean \"electors per capita\".\u003C/span\u003E\n\u003Cspan class=\"paragraph\"\u003EIt will also be useful to sometimes write this as a function of state itself.\u003C/span\u003E\n\u003Cmarimo-tex class=\"arithmatex\"\u003E||[\n\\text{AV}(s) = \\frac{e_s / E}{n_s / N}\n||]\u003C/marimo-tex\u003E\u003Cspan class=\"paragraph\"\u003EThe above expression represents the value of each vote \u003Cem\u003Ein\u003C/em\u003E state \u003Cmarimo-tex class=\"arithmatex\"\u003E||(s||)\u003C/marimo-tex\u003E, rather than the total value in the state (which would be \u003Cmarimo-tex class=\"arithmatex\"\u003E||(n_s \\cdot \\text{AV}(s) = \\frac{e_s}{E}N||)\u003C/marimo-tex\u003E). With this notation we have \u003Cmarimo-tex class=\"arithmatex\"\u003E||(\\text{AV}(x) = \\text{AV}(s(x))||)\u003C/marimo-tex\u003E (but this relationship won't hold for all value functions).\u003C/span\u003E\n\u003Cspan class=\"paragraph\"\u003ENote that AV does not depend at all on the \"winner take all\" nature of state elections. It measures \u003Cstrong\u003Eonly\u003C/strong\u003E the proportionality of electors-to-population.\u003C/span\u003E\n\u003Cspan class=\"paragraph\"\u003EAV would assign a value of \u003Cmarimo-tex class=\"arithmatex\"\u003E||(\\text{AV(x)} = 1||)\u003C/marimo-tex\u003E to every single voter if electors were assigned to states in perfect proportion to their population. This would hold whether those electors' votes were given to candidates in a \"winner take all\" fashion, as they are in almost all states at present, or if they were assigned in proportion to the popular vote in the state.\u003C/span\u003E\n\u003Cspan class=\"paragraph\"\u003EOf course, without \"fractional\" electors, there's generally no way to assign electors \u003Cmarimo-tex class=\"arithmatex\"\u003E||(e_s \\propto n_s||)\u003C/marimo-tex\u003E unless \u003Cmarimo-tex class=\"arithmatex\"\u003E||(E = N||)\u003C/marimo-tex\u003E. We therefore expect some rounding errors, at a minimum.\u003C/span\u003E\n\u003Cspan class=\"paragraph\"\u003EBut the U.S. assignment of electors is quite a bit less proportional than that. Every state receives 3 electors at a minimum, regardless of its population, corresponding to its two Senators and its minimum of 1 representative in the House. (D.C. receives 3 electors by the 23rd Amendment instead.)\u003C/span\u003E\u003C/span\u003E"}, "type": "data"}]}, {"code_hash": "e23d9d83a8a3d2bb520f23dab69211c3", "console": [], "id": "bkHC", "outputs": [{"data": {"text/markdown": "\u003Cspan class=\"markdown prose dark:prose-invert contents\"\u003E\u003Ch2 id=\"visualizing-av\"\u003EVisualizing AV\u003C/h2\u003E\n\u003Cspan class=\"paragraph\"\u003EThe apportionment values of the states are as follows:\u003C/span\u003E\u003C/span\u003E"}, "type": "data"}]}, {"code_hash": "716f1e8583d791328d6440ee0fca973b", "console": [], "id": "lEQa", "outputs": [{"data": {"text/plain": ""}, "type": "data"}]}, {"code_hash": "f92469b9dece9af83c24c2dca26e0f52", "console": [], "id": "PKri", "outputs": [{"data": {"text/html": "\u003Cmarimo-ui-element object-id='PKri-0' random-id='aaff47b9-36f0-80a8-fb02-3c5fb6285a08'\u003E\u003Cmarimo-table data-initial-value='[]' data-label='null' data-data='\u0026quot;[{\u0026#92;\u0026quot;year\u0026#92;\u0026quot;:1976,\u0026#92;\u0026quot;state\u0026#92;\u0026quot;:\u0026#92;\u0026quot;ALABAMA\u0026#92;\u0026quot;,\u0026#92;\u0026quot;state_po\u0026#92;\u0026quot;:\u0026#92;\u0026quot;AL\u0026#92;\u0026quot;,\u0026#92;\u0026quot;state_fips\u0026#92;\u0026quot;:1,\u0026#92;\u0026quot;state_cen\u0026#92;\u0026quot;:63,\u0026#92;\u0026quot;state_ic\u0026#92;\u0026quot;:41,\u0026#92;\u0026quot;representatives\u0026#92;\u0026quot;:7.0,\u0026#92;\u0026quot;delegates\u0026#92;\u0026quot;:0,\u0026#92;\u0026quot;apportionment_population\u0026#92;\u0026quot;:3444165,\u0026#92;\u0026quot;vap_estimate\u0026#92;\u0026quot;:NaN,\u0026#92;\u0026quot;vep_estimate\u0026#92;\u0026quot;:NaN,\u0026#92;\u0026quot;votes_total\u0026#92;\u0026quot;:1182850,\u0026#92;\u0026quot;votes_democrat\u0026#92;\u0026quot;:659170.0,\u0026#92;\u0026quot;votes_republican\u0026#92;\u0026quot;:504070.0,\u0026#92;\u0026quot;votes_other\u0026#92;\u0026quot;:19610.0,\u0026#92;\u0026quot;winning_party\u0026#92;\u0026quot;:\u0026#92;\u0026quot;democrat\u0026#92;\u0026quot;,\u0026#92;\u0026quot;electors\u0026#92;\u0026quot;:9.0,\u0026#92;\u0026quot;electors_democrat\u0026#92;\u0026quot;:9.0,\u00 ield\": \"year\",\n                \"title\": \"Year\",\n                \"type\": \"ordinal\"\n              },\n              {\n                \"field\": \"national_winner\",\n                \"title\": \"Winner\",\n                \"type\": \"nominal\"\n              },\n              {\n                \"field\": \"ec_pct\",\n                \"format\": \".1f\",\n                \"title\": \"EC %\",\n                \"type\": \"quantitative\"\n              },\n              {\n                \"field\": \"popular_vote_pct\",\n                \"format\": \".1f\",\n                \"title\": \"Popular Vote %\",\n                \"type\": \"quantitative\"\n              },\n              {\n                \"field\": \"v_pct\",\n                \"format\": \".1f\",\n                \"title\": \"Apportionment Value %\",\n                \"type\": \"quantitative\"\n              },\n              {\n                \"field\": \"states_won\",\n                \"title\": \"States Won\",\n                \"type\": \"quantitative\"\n              },\n              {\n                \"field\": \"party_ec\",\n                \"title\": \"Party EC\",\n                \"type\": \"quantitative\"\n              },\n              {\n                \"field\": \"total_ec\",\n                \"title\": \"Total EC\",\n                \"type\": \"quantitative\"\n              }\n            ],\n            \"x\": {\n              \"field\": \"v_pct\",\n              \"scale\": {\n                \"domain\": [\n                  0,\n                  100\n                ]\n              },\n              \"title\": \"Apportionment Value-Weighted Vote % for Party\",\n              \"type\": \"quantitative\"\n            },\n            \"y\": {\n              \"field\": \"popular_vote_pct\",\n              \"scale\": {\n                \"domain\": [\n                  0,\n                  100\n                ]\n              },\n              \"title\": \"Popular Vote % for Party\",\n              \"type\": \"quantitative\"\n            }\n          },\n          \"mark\": {\n            \"size\": 100,\n            \"type\": \"circle\"\n          }\n        },\n        {\n          \"data\": {\n            \"name\": \"data-657e202746b20e9f78fb7b5c08590918\"\n          },\n          \"encoding\": {\n            \"x\": {\n              \"field\": \"x\",\n              \"type\": \"quantitative\"\n            },\n            \"y\": {\n              \"field\": \"y\",\n              \"type\": \"quantitative\"\n            }\n          },\n          \"mark\": {\n            \"color\": \"gray\",\n            \"strokeDash\": [\n              5,\n              5\n            ],\n            \"type\": \"line\"\n          }\n        }\n      ],\n      \"title\": \"Popular Vote % vs Apportionment Value-Weighted Vote %\",\n      \"width\": 300\n    }\n  ],\n  \"title\": \"Democrats (1976-2024)\",\n  \"usermeta\": {\n    \"embedOptions\": {}\n  }\n}"}, "type": "data"}]}, {"code_hash": "de530aa0e6bcac08d97c2a8573973ea3", "console": [], "id": "qnkX", "outputs": [{"data": {"text/markdown": "\u003Cspan class=\"markdown prose dark:prose-invert contents\"\u003E\u003Cspan class=\"paragraph\"\u003EWell: it turns out that no, AVs are not much good as predictors of the actual EC outcome. What correlation we do see in the left plot is surely just due to the AV % tracking the popular % closely; the right plot looks the same.\u003C/span\u003E\n\u003Cspan class=\"paragraph\"\u003EApparently AVs are close enough to 1 on average that they don't tell us much about the results of elections. This isn't too surprising.\u003C/span\u003E\u003C/span\u003E"}, "type": "data"}]}, {"code_hash": "7f748160aa9489ead525e99677d62096", "console": [], "id": "TqIu", "outputs": [{"data": {"text/markdown": "\u003Cspan class=\"markdown prose dark:prose-invert contents\"\u003E\u003Ch1 id=\"m1-apportionment-inequality\"\u003E\u003Cstrong\u003EM1\u003C/strong\u003E: Apportionment Inequality\u003C/h1\u003E\u003C/span\u003E"}, "type": "data"}]}, {"code_hash": "9333df7430b8ae9e59a8f16662b8c8aa", "console": [], "id": "Vxnm", "outputs": [{"data": {"text/markdown": "\u003Cspan class=\"markdown prose dark:prose-invert contents\"\u003E\u003Cspan class=\"paragraph\"\u003EWe will now try to come up with a reasonable measure of the \"overall\" inequality of the value of voters' votes, according to AV. The obvious thing to characterize is the deviation of AV from a uniform distribution \u003Cmarimo-tex class=\"arithmatex\"\u003E||(V(x) = \\frac{1}{N}||)\u003C/marimo-tex\u003E. We'll therefore call these measures \"Apportionment Value Inequality\" or \"AVI\".\u003C/span\u003E\n\u003Cspan class=\"paragraph\"\u003EFor now we'll compute three measures of AVI. I'll write these as taking \"P2\" as an argument, meaning these are the definitions of these metrics for presidential election scenario 2 (a simple electoral college).\u003C/span\u003E\n\u003Cspan class=\"paragraph\"\u003E\u003Cstrong\u003EM1.1\u003C/strong\u003E Mean absolute deviation (MAD):\u003C/span\u003E\n\u003Cmarimo-tex class=\"arithmatex\"\u003E||[\n\\begin{align}\n\\text{AVI}_{\\text{MAD}}[\\text{P2}] \u0026amp;= \\frac{1}{N}\\sum_x \\vert\\text{AV(x)} - 1 \\vert \\\\\n  \u0026amp;= \\frac{1}{N}\\sum_s \\sum_{x \\in s} \\vert\\text{AV(x)} - 1 \\vert \\\\\n  \u0026amp;= \\frac{1}{N}\\sum_s n_s \\vert\\text{AV(s)} - 1 \\vert \\\\\n  \u0026amp;= \\sum_s \\left\\vert \\frac{e_s}{E} - \\frac{n_s}{N} \\right\\vert\n\\end{align}\n||]\u003C/marimo-tex\u003E\u003Cspan class=\"paragraph\"\u003E\u003Cstrong\u003EM1.2\u003C/strong\u003E Variance:\u003C/span\u003E\n\u003Cmarimo-tex class=\"arithmatex\"\u003E||[\n\\begin{align}\n\\text{AVI}_{\\text{Var}}[\\text{P2}]  \u0026amp;= {\\frac{1}{N}\\sum_x \\left(\\text{AV(x)} - 1 \\right)^2} \\\\\n  \u0026amp;= {\\frac{1}{N}\\sum_s \\sum_{x \\in s} \\left(\\text{AV(x)} - 1 \\right)^2} \\\\\n  \u0026amp;= {\\sum_s \\frac{n_s}{N} \\left(\\text{AV(s)} - 1 \\right)^2} \\\\\n  \u0026amp;=-1 +  {\\sum_s \\frac{n_s}{N} \\left(\\text{AV(s)}\\right)^2} \\\\\n\\end{align}\n||]\u003C/marimo-tex\u003E\u003Cspan class=\"paragraph\"\u003E(Actually that expression is just \u003Cmarimo-tex class=\"arithmatex\"\u003E||(\\text{E}[\\text{AV}(X)^2] - \\text{E}[\\text{AV}(X)]^2||)\u003C/marimo-tex\u003E. Not surprising.)\u003C/span\u003E\n\u003Cspan class=\"paragraph\"\u003E\u003Cstrong\u003EM1.3\u003C/strong\u003E Relative Entropy with respect to a popular election:\u003C/span\u003E\n\u003Cmarimo-tex class=\"arithmatex\"\u003E||[\n\\begin{align}\n\\text{AVI}_{\\text{Ent}}[\\text{P2}]  = H\\left[\\frac{\\text{AV}(x)}{N} ~\\Vert~ \\frac{1}{N}\\right] \u0026amp;= \\sum_x \\frac{\\text{AV}(x)}{N} \\log \\frac{\\text{AV}(x)/N}{1 / N} \\\\\n  \u0026amp;= \\frac{1}{N}\\sum_x  \\text{AV}(x) \\cdot \\log \\text{AV}(x) \\\\\n  \u0026amp;= \\frac{1}{N}\\sum_s n_s \\cdot \\text{AV}(s) \\cdot \\log \\text{AV}(s)\n\\end{align}\n||]\u003C/marimo-tex\u003E\u003Cspan class=\"paragraph\"\u003EFor each of these, 0 represents perfect equality, and is attained when \u003Cmarimo-tex class=\"arithmatex\"\u003E||(\\text{AV}(x) = 1||)\u003C/marimo-tex\u003E uniformly.\u003C/span\u003E\u003C/span\u003E"}, "type": "data"}]}, {"code_hash": "de63e6b200747eb9de908363f417e347", "console": [], "id": "DnEU", "outputs": [{"data": {"application/vnd.vegalite.v6+json": "{\n  \"$schema\": \"https://vega.github.io/schema/vega-lite/v6.1.0.json\",\n  \"config\": {\n    \"view\": {\n      \"continuousHeight\": 300,\n      \"continuousWidth\": 300\n    }\n  },\n  \"data\": {\n    \"name\": \"data-85ba3ded6dc25ff0ab53da244a460693\"\n  },\n  \"datasets\": {\n    \"data-85ba3ded6dc25ff0ab53da244a460693\": [\n      {\n        \"MAD\": 0.14820386265984806,\n        \"Relative_Entropy\": 0.029165386561182075,\n        \"Var\": 0.07680005738293402,\n        \"winning_party\": \"democrat\",\n        \"year\": 1976\n      },\n      {\n        \"MAD\": 0.14755631634141916,\n        \"Relative_Entropy\": 0. d\": \"winning_party\",\n          \"legend\": {\n            \"title\": \"Winner\"\n          },\n          \"scale\": {\n            \"domain\": [\n              \"democrat\",\n              \"republican\"\n            ],\n            \"range\": [\n              \"blue\",\n              \"darkred\"\n            ]\n          },\n          \"type\": \"nominal\"\n        },\n        \"tooltip\": [\n          {\n            \"field\": \"year\",\n            \"title\": \"Year\",\n            \"type\": \"ordinal\"\n          },\n          {\n            \"field\": \"winning_party\",\n            \"title\": \"Winner\",\n            \"type\": \"nominal\"\n          },\n          {\n            \"field\": \"Var\",\n            \"format\": \".4f\",\n            \"title\": \"Variance\",\n            \"type\": \"quantitative\"\n          }\n        ],\n        \"x\": {\n          \"field\": \"year\",\n          \"title\": \"Year\",\n          \"type\": \"ordinal\"\n        },\n        \"y\": {\n          \"field\": \"Var\",\n          \"title\": \"Variance\",\n          \"type\": \"quantitative\"\n        }\n      },\n      \"height\": 300,\n      \"mark\": {\n        \"type\": \"bar\"\n      },\n      \"title\": \"Variance\",\n      \"width\": 200\n    },\n    {\n      \"encoding\": {\n        \"color\": {\n          \"field\": \"winning_party\",\n          \"legend\": {\n            \"title\": \"Winner\"\n          },\n          \"scale\": {\n            \"domain\": [\n              \"democrat\",\n              \"republican\"\n            ],\n            \"range\": [\n              \"blue\",\n              \"darkred\"\n            ]\n          },\n          \"type\": \"nominal\"\n        },\n        \"tooltip\": [\n          {\n            \"field\": \"year\",\n            \"title\": \"Year\",\n            \"type\": \"ordinal\"\n          },\n          {\n            \"field\": \"winning_party\",\n            \"title\": \"Winner\",\n            \"type\": \"nominal\"\n          },\n          {\n            \"field\": \"Relative_Entropy\",\n            \"format\": \".4f\",\n            \"title\": \"Relative Entropy\",\n            \"type\": \"quantitative\"\n          }\n        ],\n        \"x\": {\n          \"field\": \"year\",\n          \"title\": \"Year\",\n          \"type\": \"ordinal\"\n        },\n        \"y\": {\n          \"field\": \"Relative_Entropy\",\n          \"title\": \"Relative Entropy\",\n          \"type\": \"quantitative\"\n        }\n      },\n      \"height\": 300,\n      \"mark\": {\n        \"type\": \"bar\"\n      },\n      \"title\": \"Relative Entropy\",\n      \"width\": 200\n    }\n  ],\n  \"usermeta\": {\n    \"embedOptions\": {}\n  }\n}"}, "type": "data"}]}, {"code_hash": "47a228e871dbd01b69b7ea59f8ffec9c", "console": [], "id": "ulZA", "outputs": [{"data": {"text/markdown": "\u003Cspan class=\"markdown prose dark:prose-invert contents\"\u003E\u003Cspan class=\"paragraph\"\u003E... they all look pretty similar.\u003C/span\u003E\u003C/span\u003E"}, "type": "data"}]}, {"code_hash": "a6fd46a91d5ed7b37585bf40d5fca761", "console": [], "id": "ecfG", "outputs": [{"data": {"text/markdown": "\u003Cspan class=\"markdown prose dark:prose-invert contents\"\u003E\u003Ch2 id=\"further-thoughts-on-avi\"\u003EFurther Thoughts on AVI\u003C/h2\u003E\u003C/span\u003E"}, "type": "data"}]}, {"code_hash": "5ebef311d6205b8080fef2b1887d1a9d", "console": [], "id": "Pvdt", "outputs": [{"data": {"text/markdown": "\u003Cspan class=\"markdown prose dark:prose-invert contents\"\u003E\u003Cspan class=\"paragraph\"\u003EThese numbers aren't very meaningful on their own, but we'll use them later when we want to compare different approachs to the \u003Cem\u003Esame\u003C/em\u003E election, for example, if we switch to proportional assignments of electors, or remove non-citizens from AP before assigning electors.\u003C/span\u003E\n\u003Cspan class=\"paragraph\"\u003ERecording a few thoughts on these measures:\u003C/span\u003E\n\u003Cspan class=\"paragraph\"\u003EWhat \"population\" variable should we use?\u003C/span\u003E\n\u003Cul\u003E\n\u003Cli\u003EThe obvious guess is \"apportionment population\", but not everyone counted in AP can vote\u003C/li\u003E\n\u003Cli\u003EUsing VAP/VEP makes it a measure of \"average impact on the election over potential voters\"\u003C/li\u003E\n\u003Cli\u003E\n\u003Cspan class=\"paragraph\"\u003EUsing VP makes it an average over actual voters\u003C/span\u003E\n\u003Cul\u003E\n\u003Cli\u003Ebut VP is downstream of actual turnout, which we expect to be affected by incentivize to vote under apportionment.\u003C/li\u003E\n\u003C/ul\u003E\n\u003C/li\u003E\n\u003C/ul\u003E\n\u003Cspan class=\"paragraph\"\u003EWe could also try to characterize the EC distribution \u003Cmarimo-tex class=\"arithmatex\"\u003E||(\\frac{e_s}{E}||)\u003C/marimo-tex\u003E relative to the state population distribution \u003Cmarimo-tex class=\"arithmatex\"\u003E||(\\frac{n_s}{N}||)\u003C/marimo-tex\u003E.\u003C/span\u003E\n\u003Cspan class=\"paragraph\"\u003EAn obvious one is relative entropy:\u003C/span\u003E\n\u003Cmarimo-tex class=\"arithmatex\"\u003E||[\n\\begin{align}\nH\\left[ \\frac{e_s}{E} ~\\Vert \\frac{n_s}{N} \\right] \u0026amp;= \\sum_s \\frac{e_s}{E} \\log \\frac{e_s / E}{n_s / N} \\\\\n \u0026amp;= \\sum_s \\frac{n_s}{N}\\cdot \\frac{e_s / E}{n_s / N} \\log \\frac{e_s / E}{n_s / N}  \\\\\n \u0026amp;= \\frac{1}{N} \\sum_s n_s \\cdot \\text{AV}(s) \\log \\text{AV}(s)\\\\\n \u0026amp;= H\\left[\\frac{\\text{AV}(X)}{N} ~\\Vert~ \\frac{1}{N}\\right]\n\\end{align}\n||]\u003C/marimo-tex\u003E\u003Cspan class=\"paragraph\"\u003E... but interestingly, this is the same as the relative entropy on the population level of \u003Cmarimo-tex class=\"arithmatex\"\u003E||(\\text{AV}[x]/N||)\u003C/marimo-tex\u003E relative to \u003Cmarimo-tex class=\"arithmatex\"\u003E||(\\frac{1}{N}||)\u003C/marimo-tex\u003E.\u003C/span\u003E\n\u003Cspan class=\"paragraph\"\u003EOther questions:\u003C/span\u003E\n\u003Cul\u003E\n\u003Cli\u003EIs it worth considering relative entropy going the other way, \u003Cmarimo-tex class=\"arithmatex\"\u003E||(H[1/N ~\\Vert~ \\text{AV}/N]||)\u003C/marimo-tex\u003E? AI tells me this is called a \"Theil index\" of inequality, but I can't see the sense in it.\u003C/li\u003E\n\u003Cli\u003EWorth considering RMS w.r.t. 0 instead of 1?\u003C/li\u003E\n\u003C/ul\u003E\u003C/span\u003E"}, "type": "data"}]}, {"code_hash": null, "console": [], "id": "ZBYS", "outputs": [{"data": {"text/plain": ""}, "type": "data"}]}], "metadata": {"marimo_version": "0.19.6"}, "version": "1"},
            "runtimeConfig": null,
        };
