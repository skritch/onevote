      function __resizeIframe(obj) {
        const scrollbarHeight = 20; // Max between windows, mac, and linux

        function setHeight() {
          // Guard against race condition where iframe isn't ready
          if (!obj.contentWindow?.document?.documentElement) {
            return;
          }
          const element = obj.contentWindow.document.documentElement;
          // If there is no vertical scrollbar, we don't need to resize the iframe
          if (element.scrollHeight === element.clientHeight) {
            return;
          }

          // Create a new height that includes the scrollbar height if it's visible
          const hasHorizontalScrollbar = element.scrollWidth > element.clientWidth;
          const newHeight = element.scrollHeight + (hasHorizontalScrollbar ? scrollbarHeight : 0);

          // Only update the height if it's different from the current height
          if (obj.style.height !== `${newHeight}px`) {
            obj.style.height = `${newHeight}px`;
          }
        }

        // Resize the iframe to the height of the content and bottom scrollbar height
        setHeight();

        // Resize the iframe when the content changes
        const resizeObserver = new ResizeObserver((_entries) => {
          setHeight();
        });
        // Only observe if iframe content is ready
        if (obj.contentWindow?.document?.body) {
          resizeObserver.observe(obj.contentWindow.document.body);
        }
      }
    </script>

            "notebook": {"cells": [{"code": "", "code_hash": "dcaae9a70570425e2d49fb85eda622e5", "config": {"column": null, "disabled": false, "hide_code": true}, "id": "Hbol", "name": "_"}, {"code": "", "code_hash": "84663ee625a7d98318f54f1d06bf0b90", "config": {"column": null, "disabled": false, "hide_code": true}, "id": "MJUe", "name": "_"}, {"code": "", "code_hash": "c50d9801193c3a68a2be494f1d0ce076", "config": {"column": null, "disabled": false, "hide_code": true}, "id": "vblA", "name": "_"}, {"code": "", "code_hash": "2b187e5a5c661feb56b50f2a20b1f9cb", "config": {"column": null, "disabled": false, "hide_code": true}, "id": "bkHC", "name": "_"}, {"code": "", "code_hash": "2d9922c0894d80d28514983849f58b6c", "config": {"column": null, "disabled": false, "hide_code": true}, "id": "lEQa", "name": "_"}, {"code": "", "code_hash": "1ef1c1a536cb326fd720f1ae78cc8c72", "config": {"column": null, "disabled": false, "hide_code": true}, "id": "PKri", "name": "_"}, {"code": "", "code_hash": "bf7c5f9b07d514c3367adb7ce00bbe9c", "config": {"column": null, "disabled": false, "hide_code": true}, "id": "Xref", "name": "_"}, {"code": "", "code_hash": "1d0db38904205bec4d6f6f6a1f6cec3e", "config": {"column": null, "disabled": false, "hide_code": true}, "id": "SFPL", "name": "_"}], "metadata": {"marimo_version": "0.19.6"}, "version": "1"},
            "session": {"cells": [{"code_hash": "dcaae9a70570425e2d49fb85eda622e5", "console": [], "id": "Hbol", "outputs": [{"data": {"text/markdown": "\u003Cspan class=\"markdown prose dark:prose-invert contents\"\u003E\u003Ch1 id=\"analysis-overview\"\u003EAnalysis Overview\u003C/h1\u003E\n\u003Cspan class=\"paragraph\"\u003EOur goal is to answer the questions:\u003C/span\u003E\n\u003Cspan class=\"paragraph\"\u003E\u003Cstrong\u003EQ1\u003C/strong\u003E. How much is your vote worth in a given election?\u003C/span\u003E\n\u003Cspan class=\"paragraph\"\u003EAnswer to this question will be called \"values\" and given identifiers like \u003Cstrong\u003EV1\u003C/strong\u003E.\u003C/span\u003E\n\u003Cspan class=\"paragraph\"\u003E\u003Cstrong\u003EQ2\u003C/strong\u003E. How do we measure the fairness of the election overall?\u003C/span\u003E\n\u003Cspan class=\"paragraph\"\u003EAnswer to this question will be called \"measures of fairness\" and given identifiers like \u003Cstrong\u003EM1\u003C/strong\u003E.\u003C/span\u003E\n\u003Cspan class=\"paragraph\"\u003EA value might come with an obvious measure, or not.\u003C/span\u003E\u003C/span\u003E"}, "type": "data"}]}, {"code_hash": "84663ee625a7d98318f54f1d06bf0b90", "console": [], "id": "MJUe", "outputs": [{"data": {"text/markdown": "\u003Cspan class=\"markdown prose dark:prose-invert contents\"\u003E\u003Chr /\u003E\n\u003Ch2 id=\"levels-of-analysis\"\u003ELevels of Analysis\u003C/h2\u003E\n\u003Cspan class=\"paragraph\"\u003EThere are many ways to go about assigning the \"value\" of a vote. We can generally organize these into categories depending on what kind of information goes into the measure:\u003C/span\u003E\n\u003Cspan class=\"paragraph\"\u003E\u003Cstrong\u003EL1\u003C/strong\u003E. \u003Cstrong\u003EThe voting system alone\u003C/strong\u003E. Here we have the theoretical issues with \"first-past-the-post\" / \"plurality\" voting, including:\u003C/span\u003E\n\u003Col\u003E\n\u003Cli\u003EWasted votes in general. If only one candidate is elected, all other votes count, in a certain sense, zero. (This is not a great argument, see L4.) Party-proportional representation and the like can help with this problem, where applicable.\u003C/li\u003E\n\u003Cli\u003EPotential for spoilers. Ranked-choice and similar systems help here.\u003C/li\u003E\n\u003Cli\u003ETheoretical incentives on candidates and platforms due to FPIP/plurality systems.\u003C/li\u003E\n\u003C/ol\u003E\n\u003Cspan class=\"paragraph\"\u003EI won't attempt to take on this level.\u003C/span\u003E\n\u003Cspan class=\"paragraph\"\u003EIt will be easier to work at L2 or L3, which take somewhat more of reality into account.\u003C/span\u003E\n\u003Cspan class=\"paragraph\"\u003E\u003Cstrong\u003EL2\u003C/strong\u003E. \u003Cstrong\u003EVoting systems + state populations + apportionment\u003C/strong\u003E.\u003C/span\u003E\n\u003Col\u003E\n\u003Cli\u003E\n\u003Cspan class=\"paragraph\"\u003EHere the main issues are is the inequality of apportionment, such as:\u003C/span\u003E\n\u003Cul\u003E\n\u003Cli\u003EUnequal apportionment of electors to states. In the U.S. each state has 3 minimum. Wyoming receives 3 electors for only 600K people (200K/elector) while California has 54 electors for 40M (740K / elector).\u003C/li\u003E\n\u003Cli\u003EDiscrepancies due to winner-take-all assignments instead of electors voting with their associated district or party-proportionally.\u003C/li\u003E\n\u003Cli\u003ERounding issues\u003C/li\u003E\n\u003C/ul\u003E\n\u003C/li\u003E\n\u003Cli\u003EAny philosophical issues with the calculation of apportionment, e.g. illegal aliens being counted, exclusion of overseas territories, ages under consideration, etc.\u003C/li\u003E\n\u003C/ol\u003E\n\u003Cspan class=\"paragraph\"\u003E\u003Cstrong\u003EL3\u003C/strong\u003E. \u003Cstrong\u003EVoting system + population + party affiliations\u003C/strong\u003E.\u003C/span\u003E\n\u003Col\u003E\n\u003Cli\u003EWasted votes, in some sense. Here we should be able to characterize \"swing states\"--states where every vote is inherently much more likely to affect the overall outcome, just because the election is likely to be close and to have a marginal effect on the national election. How wasted a vote is will depend on the party affiliation (ex post or ex ante, see below).\u003C/li\u003E\n\u003Cli\u003EGerrymandering (which is really a way of engineering wasted-votes)\u003C/li\u003E\n\u003Cli\u003ESpoilers, i.e. 3rd party candidates stealing votes from major parties and the like\u003C/li\u003E\n\u003C/ol\u003E\n\u003Cspan class=\"paragraph\"\u003EHere \"party affiliation\" might be defined in various ways:\u003C/span\u003E\n\u003Cul\u003E\n\u003Cli\u003E\u003Cem\u003Eex post\u003C/em\u003E actual election outcomes (note this is not necessarily a better definition than \u003Cem\u003Ea priori\u003C/em\u003E estimates, as it is causally downstream of the election system itself, see L4.)\u003C/li\u003E\n\u003Cli\u003E\n\u003Cspan class=\"paragraph\"\u003E*ex ante estimates of election outcomes\u003C/span\u003E\n\u003Cul\u003E\n\u003Cli\u003Ethe simplest is \"whatever happened last time\"\u003C/li\u003E\n\u003Cli\u003Epolling\u003C/li\u003E\n\u003Cli\u003Estatistical models\u003C/li\u003E\n\u003C/ul\u003E\n\u003C/li\u003E\n\u003Cli\u003E\"true\" party affiliations (which are only an idealization)\u003C/li\u003E\n\u003Cli\u003E\n\u003Cspan class=\"paragraph\"\u003Eestimated party affiliations\u003C/span\u003E\n\u003Cul\u003E\n\u003Cli\u003Evoter registrations\u003C/li\u003E\n\u003Cli\u003Epolling\u003C/li\u003E\n\u003Cli\u003Estatistical models\u003C/li\u003E\n\u003C/ul\u003E\n\u003C/li\u003E\n\u003C/ul\u003E\n\u003Cspan class=\"paragraph\"\u003EWe may also need to estimate turnout to determine how close an election is likely to be. Again we have options:\u003C/span\u003E\n\u003Cul\u003E\n\u003Cli\u003E\u003Cem\u003Eex post\u003C/em\u003E actual turnout\u003C/li\u003E\n\u003Cli\u003E\n\u003Cspan class=\"paragraph\"\u003E\u003Cem\u003Eex ante estimates\u003C/em\u003E\u003C/span\u003E\n\u003Cul\u003E\n\u003Cli\u003Ewhat happened last time\u003C/li\u003E\n\u003Cli\u003Epolling\u003C/li\u003E\n\u003Cli\u003Evoter registrations\u003C/li\u003E\n\u003Cli\u003Estatistical models\u003C/li\u003E\n\u003C/ul\u003E\n\u003C/li\u003E\n\u003C/ul\u003E\n\u003Cspan class=\"paragraph\"\u003E\u003Cstrong\u003EL4\u003C/strong\u003E. \u003Cstrong\u003EVoting system + population + party affiliations + dynamical effects\u003C/strong\u003E, i.e. feedback from the voting system affecting...\u003C/span\u003E\n\u003Col\u003E\n\u003Cli\u003E...candidates and platforms, Candidates are chosen to appeal to moderates, and are chosen \u003Cem\u003Eby\u003C/em\u003E primaries or similar; the effect is that approxime party affiliations of a population have some sort of dynamical effect on the candidates themselves--to be more radical in the primaries and then moderate, to avoid alienating their base or moderates with certain issues, etc.\u003C/li\u003E\n\u003Cli\u003E...canvassing, ad spend, etc.\u003C/li\u003E\n\u003Cli\u003E...voter turnout--whether people vote depends on the perception that their votes will matter.\u003C/li\u003E\n\u003C/ol\u003E\n\u003Cspan class=\"paragraph\"\u003EThese quickly get complex, so we won't take them on for now.\u003C/span\u003E\n\u003Cspan class=\"paragraph\"\u003EBut we should keep this category in mind when considering \u003Cem\u003Ecounterfactuals\u003C/em\u003E: the turnout which actually occurs, say, is some function of the voting system and party affiliations; we cannot simply say \"what would have been the outcome of a national general election under such-and-such system?\", because different voters would have showed up, candidates would have positioned themselves and advertised differently, etc.\u003C/span\u003E\n\u003Cspan class=\"paragraph\"\u003E\u003Cstrong\u003EL5\u003C/strong\u003E. \u003Cstrong\u003EWrong and Missing Votes\u003C/strong\u003E:\u003C/span\u003E\n\u003Col\u003E\n\u003Cli\u003EVoters unable to take time off or travel to polling place.\u003C/li\u003E\n\u003Cli\u003ELost ballots\u003C/li\u003E\n\u003Cli\u003ERestrictions on voting itself: unreasonable ID requirements, intimidation, poll taxes, etc.\u003C/li\u003E\n\u003Cli\u003EFraud\u003C/li\u003E\n\u003Cli\u003EPhilosophical issues with the franchise itself, such as the exclusion of overseas territories\u003C/li\u003E\n\u003C/ol\u003E\n\u003Cspan class=\"paragraph\"\u003EWe could further try to quantify the effect of wrong votes on the voters who \u003Cem\u003Edid\u003C/em\u003E vote--to what extent were they disenfranchised by the loss of their potential allies?\u003C/span\u003E\n\u003Cspan class=\"paragraph\"\u003EIt will likely be useful to try to characterize wrong/lost/fraudlent votes as affecting the value of \u003Cem\u003Eeverybody\u003C/em\u003E's political expression, regardless of their effect on the outcome themselves\u2014an L2 effect rather than L3. A kind of \"information loss\" comes to mind.\u003C/span\u003E\n\u003Cspan class=\"paragraph\"\u003E\u003Cstrong\u003EL6\u003C/strong\u003E. \u003Cstrong\u003EIssues with the expression of electorate's preferences\u003C/strong\u003E.\u003C/span\u003E\n\u003Col\u003E\n\u003Cli\u003EEffects of primarying/caucuses and party conventions.\u003C/li\u003E\n\u003Cli\u003E\"Median voter theorem\" and \"Hotelling's law\"-type incentivizes for candidates.\u003C/li\u003E\n\u003C/ol\u003E\n\u003Cspan class=\"paragraph\"\u003EThese quickly get complex, so we won't take them on for now.\u003C/span\u003E\n\u003Chr /\u003E\n\u003Cspan class=\"paragraph\"\u003EOf all the above categories, my intuition is that the most tractable angles for quantifying the \"fairness\" of the U.S. presidential election will be:\u003C/span\u003E\n\u003Cul\u003E\n\u003Cli\u003EL2.1, apportionment.\u003C/li\u003E\n\u003Cli\u003EL3.1, wasted votes.\u003C/li\u003E\n\u003Cli\u003EL5, missing votes.\u003C/li\u003E\n\u003C/ul\u003E\u003C/span\u003E"}, "type": "data"}]}, {"code_hash": "c50d9801193c3a68a2be494f1d0ce076", "console": [], "id": "vblA", "outputs": [{"data": {"text/markdown": "\u003Cspan class=\"markdown prose dark:prose-invert contents\"\u003E\u003Ch2 id=\"population-variables\"\u003EPopulation Variables\u003C/h2\u003E\n\u003Cspan class=\"paragraph\"\u003EWe'll be making a lot of use of \"populations\", and it will helpful to be clear about what we mean.\u003C/span\u003E\n\u003Cspan class=\"paragraph\"\u003EThe following tables lists the different populations variables we might use:\u003C/span\u003E\n\u003Ctable\u003E\n\u003Cthead\u003E\n\u003Ctr\u003E\n\u003Cth\u003EVariable\u003C/th\u003E\n\u003Cth\u003EFull Name\u003C/th\u003E\n\u003Cth\u003EDescription\u003C/th\u003E\n\u003Cth\u003ENationally in 2020\u003C/th\u003E\n\u003Cth\u003EIn dataset?\u003C/th\u003E\n\u003C/tr\u003E\n\u003C/thead\u003E\n\u003Ctbody\u003E\n\u003Ctr\u003E\n\u003Ctd\u003EP\u003C/td\u003E\n\u003Ctd\u003Epopulation\u003C/td\u003E\n\u003Ctd\u003Ethe census residential population of a state\u003C/td\u003E\n\u003Ctd\u003E331.4M\u003C/td\u003E\n\u003Ctd\u003E\u003C/td\u003E\n\u003C/tr\u003E\n\u003Ctr\u003E\n\u003Ctd\u003EAP\u003C/td\u003E\n\u003Ctd\u003Eapportionment population\u003C/td\u003E\n\u003Ctd\u003EP + overseas federal employees and their dependents - indigenous populations \"not taxed\"\u003C/td\u003E\n\u003Ctd\u003E331.8M\u003Csup id=\"fnref:2-ap\"\u003E\u003Ca class=\"footnote-ref\" href=\"#fn:2-ap\"\u003E1\u003C/a\u003E\u003C/sup\u003E\u003C/td\u003E\n\u003Ctd\u003E\u003Ccode\u003Eapportionment_population\u003C/code\u003E\u003C/td\u003E\n\u003C/tr\u003E\n\u003Ctr\u003E\n\u003Ctd\u003EVAP\u003C/td\u003E\n\u003Ctd\u003Evoting-age population\u003C/td\u003E\n\u003Ctd\u003Eall residents 18 and older.\u003C/td\u003E\n\u003Ctd\u003E258M\u003C/td\u003E\n\u003Ctd\u003E\u003Ccode\u003Evap_estimate\u003C/code\u003E\u003C/td\u003E\n\u003C/tr\u003E\n\u003Ctr\u003E\n\u003Ctd\u003ECVAP\u003C/td\u003E\n\u003Ctd\u003Ecivizen voting-age population\u003C/td\u003E\n\u003Ctd\u003EVAP - non-citizens\u003C/td\u003E\n\u003Ctd\u003E233M\u003C/td\u003E\n\u003Ctd\u003E\u003C/td\u003E\n\u003C/tr\u003E\n\u003Ctr\u003E\n\u003Ctd\u003EVEP\u003C/td\u003E\n\u003Ctd\u003Evoting-eligible population\u003C/td\u003E\n\u003Ctd\u003ECVAP - citizens from voting, e.g. felons.\u003C/td\u003E\n\u003Ctd\u003E231M\u003C/td\u003E\n\u003Ctd\u003E\u003Ccode\u003Evep_estimate\u003C/code\u003E\u003C/td\u003E\n\u003C/tr\u003E\n\u003Ctr\u003E\n\u003Ctd\u003EVP\u003C/td\u003E\n\u003Ctd\u003Evoting population\u003C/td\u003E\n\u003Ctd\u003EActual number of voters\u003C/td\u003E\n\u003Ctd\u003E158M\u003C/td\u003E\n\u003Ctd\u003E\u003Ccode\u003Evotes_total\u003C/code\u003E\u003C/td\u003E\n\u003C/tr\u003E\n\u003C/tbody\u003E\n\u003C/table\u003E\n\u003Cspan class=\"paragraph\"\u003EWe will typically refer to these variables by their acronyms AP, VAP.\u003C/span\u003E\n\u003Cspan class=\"paragraph\"\u003ETODO: work out exactly how and where P/AP differ in the census data itself.\u003C/span\u003E\n\u003Cspan class=\"paragraph\"\u003ETODO: work out relationship of citizenship to VEP\u003C/span\u003E\n\u003Cdiv class=\"footnote\"\u003E\n\u003Chr /\u003E\n\u003Col\u003E\n\u003Cli id=\"fn:2-ap\"\u003EThe census definition of AP excludes the ~700k residents of D.C., who have no representation in the House (except for 1 non-voting delegate), and are then granted their 3 electors by the 23rd Amendment. Under that definition the total would be 331.1M. My \u003Ccode\u003Eapportionment_population\u003C/code\u003E variable differs from this in that it sdoes include D.C., as we do want to assign it an AP : elector ratio.\u0026#160;\u003Ca class=\"footnote-backref\" href=\"#fnref:2-ap\" title=\"Jump back to footnote 1 in the text\"\u003E\u0026#8617;\u003C/a\u003E\u003C/li\u003E\n\u003C/ol\u003E\n\u003C/div\u003E\u003C/span\u003E"}, "type": "data"}]}, {"code_hash": "2b187e5a5c661feb56b50f2a20b1f9cb", "console": [], "id": "bkHC", "outputs": [{"data": {"text/markdown": "\u003Cspan class=\"markdown prose dark:prose-invert contents\"\u003E\u003Chr /\u003E\n\u003Cspan class=\"paragraph\"\u003EIt will help to give identifiers to the scenarios we would like to compare.\u003C/span\u003E\n\u003Ch2 id=\"presidential-electoral-scenarios\"\u003EPresidential Electoral Scenarios\u003C/h2\u003E\n\u003Cspan class=\"paragraph\"\u003EWe'll start with these:\u003C/span\u003E\n\u003Cspan class=\"paragraph\"\u003E\u003Cstrong\u003EP1\u003C/strong\u003E. A national general election.\u003C/span\u003E\n\u003Cspan class=\"paragraph\"\u003E\u003Cstrong\u003EP2\u003C/strong\u003E. Simplified electoral college: electors assigned by winner-take-all in all states. Two parties only.\u003C/span\u003E\n\u003Cspan class=\"paragraph\"\u003E\u003Cstrong\u003EP3\u003C/strong\u003E. Actual electoral college: electors assigned by winner-take-all in all states but Maine and Nebraska, which assign their House electors to winners of districts. Arbitrarily many third parties.\u003C/span\u003E\n\u003Cspan class=\"paragraph\"\u003E\u003Cstrong\u003EP4\u003C/strong\u003E. Districtized Electoral College: assign senate electors to state winners, district electors to district winners, i.e. what Maine and Nebraska do today, in all states.\u003C/span\u003E\n\u003Cspan class=\"paragraph\"\u003E\u003Cstrong\u003EP5\u003C/strong\u003E. Party-proportional Electoral College: assign state electors, including senate electors, in proportion to vote share in each state.\u003C/span\u003E\n\u003Cspan class=\"paragraph\"\u003EThis requires choosing method of handling remainders. The obvious method is to assign the remaining elector(s) to parties in descending order of their remaining votes.\u003C/span\u003E\n\u003Chr /\u003E\n\u003Cspan class=\"paragraph\"\u003ESome lower priority ideas\u003C/span\u003E\n\u003Cspan class=\"paragraph\"\u003E\u003Cstrong\u003EP6\u003C/strong\u003E. National ranked-choice/instant-runoff.\u003C/span\u003E\n\u003Cspan class=\"paragraph\"\u003EThis is very interesting, but will be hard to come up with realistic data for this, but I imagine someone has estimated it.\u003C/span\u003E\n\u003Cspan class=\"paragraph\"\u003E\u003Cstrong\u003EP7, P8, and P9\u003C/strong\u003E. As P2, P4, and P5, but without the 2 Senate electors per state.\u003C/span\u003E\n\u003Cspan class=\"paragraph\"\u003E\u003Cstrong\u003EP10\u003C/strong\u003E. Ranked-choice/instant-runoff-type schemes to determine electors at the state level.\u003C/span\u003E\n\u003Cspan class=\"paragraph\"\u003E\u003Cstrong\u003EP11\u003C/strong\u003E. As P10 but at the district level.\u003C/span\u003E\u003C/span\u003E"}, "type": "data"}]}, {"code_hash": "2d9922c0894d80d28514983849f58b6c", "console": [], "id": "lEQa", "outputs": [{"data": {"text/markdown": "\u003Cspan class=\"markdown prose dark:prose-invert contents\"\u003E\u003Chr /\u003E\n\u003Ch2 id=\"philosophical-considerations-for-value-and-measure-design\"\u003EPhilosophical Considerations for Value and Measure Design\u003C/h2\u003E\n\u003Cspan class=\"paragraph\"\u003ETrying to read about these topics online, I am led to the conclusion that the field (or the part of it which rises to the surface on Wikipedia and the like) is quite muddled. The point of all the structure I am establishing here is to un-muddle things.\u003C/span\u003E\n\u003Cspan class=\"paragraph\"\u003EAs above, our measures may turn out to target any of the levels L1... L6 above. My ambition, for the presidential election, is to target:\u003C/span\u003E\n\u003Cul\u003E\n\u003Cli\u003EL2. Apportionment\u003C/li\u003E\n\u003Cli\u003EL3. Waste\u003C/li\u003E\n\u003Cli\u003EL5. Lost Votes\u003C/li\u003E\n\u003C/ul\u003E\n\u003Cspan class=\"paragraph\"\u003EThat is, \"purely theoretical\" (L1), \"dynamical\" (L4), and the \"underlying preferences\" (L6) are out of scope, though we may still take them into consideration. A reasonable voting system should be \u003Cem\u003Esimple\u003C/em\u003E; it is as important that it \"feel\" fair as it is that it \"be\" fair.\u003C/span\u003E\n\u003Cspan class=\"paragraph\"\u003EI want to additionally place the following stipulation on measures of fairness:\u003C/span\u003E\n\u003Cspan class=\"paragraph\"\u003E\u003Cem\u003EA fully general election for a single office is perfectly fair\u003C/em\u003E.\u003Csup id=\"fnref:2-general\"\u003E\u003Ca class=\"footnote-ref\" href=\"#fn:2-general\"\u003E1\u003C/a\u003E\u003C/sup\u003E\u003C/span\u003E\n\u003Cspan class=\"paragraph\"\u003EThis immediately rules out a lot of \"wasted vote\" measures which treat \u003Cem\u003Eall the losing candidate's votes\u003C/em\u003E as wasted. This is a pointless view. This also steers us far away from measures which attempt to quantify \"the probability of a vote being decisive\", which to me seems rather nonsensical: such a probability is a function of a lot of things beyond the \u003Cem\u003Efairness of the election system itself\u003C/em\u003E.\u003C/span\u003E\n\u003Cspan class=\"paragraph\"\u003EInstead, what we want to measure is something like the \"incentivize for a candidate to appeal to a voter\". In the view of a candidate trying to win votes, all votes in a general election trade one-for-one against each other--hence, all are equal.\u003C/span\u003E\n\u003Cspan class=\"paragraph\"\u003EThat is: our philosophical outlook is that we would like to measure the \u003Cem\u003Einfluence of a voter's preferences on the policies/platform which result from the election\u003C/em\u003E (bringing in a bit of L6), rather than the \u003Cem\u003Einfluence of their vote\u003C/em\u003E. The majority of the influencing happens before the time of the vote!\u003C/span\u003E\n\u003Cspan class=\"paragraph\"\u003ENow an immediate objection is that, \u003Cem\u003Ein practice\u003C/em\u003E candidates are going to mostly be interested in changing the minds of voters near the \u003Cem\u003Emedian\u003C/em\u003E (assuming preferences are basically linear).\u003C/span\u003E\n\u003Cspan class=\"paragraph\"\u003EI think this is fine, for two main reasons:\u003C/span\u003E\n\u003Cul\u003E\n\u003Cli\u003EThe \"ideal\" winner of an idealized general election \u003Cem\u003Eis\u003C/em\u003E one who reflects the views of median voter. Who else would it be??\u003Csup id=\"fnref:2-mvt\"\u003E\u003Ca class=\"footnote-ref\" href=\"#fn:2-mvt\"\u003E2\u003C/a\u003E\u003C/sup\u003E\u003C/li\u003E\n\u003Cli\u003EWhile candidates of course will position themselves and target their rhetoric in ways which efficiently win over the public in the neighborhood of the median, it is still the case that every voter in a general election exerts the same influence over the \"position of the median\"--you can move it by, at most, one spot in either direction.\u003C/li\u003E\n\u003C/ul\u003E\n\u003Cspan class=\"paragraph\"\u003ELet us also enumerate briefly some of the ways a real election differs from an \"idealized\" one:\u003C/span\u003E\n\u003Cul\u003E\n\u003Cli\u003Ethe candidates (or their views) are selected (or change) on the basis of the electorate's own views (this is good--a representative should represent!)\u003C/li\u003E\n\u003Cli\u003Ecandidates have noisy/biased signals of the electorate's preferences, and v.v.\u003C/li\u003E\n\u003Cli\u003Ecandidates have inherent levels of \"quality\" and/or \"likeability\" as people, independent of their political views.\u003C/li\u003E\n\u003Cli\u003Ecandidates have some power to \u003Cem\u003Ealter\u003C/em\u003E the views of the electorate. (Potentially a lot of power, as the Trump era demonstrates.)\u003C/li\u003E\n\u003C/ul\u003E\n\u003Cspan class=\"paragraph\"\u003EAll of these are certainly true, but should not really affect whether an election is \"fair\", at least to first order. This is, really, a simpler problem.\u003C/span\u003E\n\u003Cdiv class=\"footnote\"\u003E\n\u003Chr /\u003E\n\u003Col\u003E\n\u003Cli id=\"fn:2-general\"\u003EIt may be said that this is a biased place to start from. Well--too bad. I think this is so obvious as to not be worth talking about. I really cannot think of a way any other system could be \"fairer\" than this, for a single office\u2014it treats all votrers equally; that is a low bar to clear. And yet.\u0026#160;\u003Ca class=\"footnote-backref\" href=\"#fnref:2-general\" title=\"Jump back to footnote 1 in the text\"\u003E\u0026#8617;\u003C/a\u003E\u003C/li\u003E\n\u003Cli id=\"fn:2-mvt\"\u003EThis brings to mind the \u003Ca href=\"https://en.wikipedia.org/wiki/Median_voter_theorem\" rel=\"noopener noreferrer\" target=\"_blank\"\u003Emedian voter theorem\u003C/a\u003E, which says that, under reasonable conditions, an election will choose the candidate \u003Cem\u003Epreferred\u003C/em\u003E by the median voter. Note this is not quite the same thing as \"reflecting the views of the median\", as it takes the candidates themselves as fixed.\u0026#160;\u003Ca class=\"footnote-backref\" href=\"#fnref:2-mvt\" title=\"Jump back to footnote 2 in the text\"\u003E\u0026#8617;\u003C/a\u003E\u003C/li\u003E\n\u003C/ol\u003E\n\u003C/div\u003E\u003C/span\u003E"}, "type": "data"}]}, {"code_hash": "1ef1c1a536cb326fd720f1ae78cc8c72", "console": [], "id": "PKri", "outputs": [{"data": {"text/markdown": "\u003Cspan class=\"markdown prose dark:prose-invert contents\"\u003E\u003Chr /\u003E\n\u003Ch2 id=\"basic-notation\"\u003EBasic Notation\u003C/h2\u003E\n\u003Cspan class=\"paragraph\"\u003EWe will use \u003Cmarimo-tex class=\"arithmatex\"\u003E||(n_s, n_d||)\u003C/marimo-tex\u003E similar to represent the \"population of state \u003Cmarimo-tex class=\"arithmatex\"\u003E||(s||)\u003C/marimo-tex\u003E or district \u003Cmarimo-tex class=\"arithmatex\"\u003E||(d||)\u003C/marimo-tex\u003E\", with variables like \u003Cmarimo-tex class=\"arithmatex\"\u003E||(S, D||)\u003C/marimo-tex\u003E for the number of states or districts. These will sum to \u003Cmarimo-tex class=\"arithmatex\"\u003E||(N = \\sum_s n_s||)\u003C/marimo-tex\u003E across all voters. Here \u003Cmarimo-tex class=\"arithmatex\"\u003E||(n_s||)\u003C/marimo-tex\u003E and \u003Cmarimo-tex class=\"arithmatex\"\u003E||(N||)\u003C/marimo-tex\u003E may represent any of the population variables described above\u2014we'll sometimes calculate the same quantity with different population variables. When we want to be specific we'll use a subscript \u003Cmarimo-tex class=\"arithmatex\"\u003E||(N_{AP}, N_{VAP}, \\ldots||)\u003C/marimo-tex\u003E or perhaps a text-function like \u003Cmarimo-tex class=\"arithmatex\"\u003E||(\\text{AP}(s)||)\u003C/marimo-tex\u003E.\u003C/span\u003E\n\u003Cspan class=\"paragraph\"\u003EWe'll use the symbol \u003Cmarimo-tex class=\"arithmatex\"\u003E||(e_s||)\u003C/marimo-tex\u003E for the electors assigned to state \u003Cmarimo-tex class=\"arithmatex\"\u003E||(s||)\u003C/marimo-tex\u003E, with \u003Cmarimo-tex class=\"arithmatex\"\u003E||(E = \\sum_s e_s||)\u003C/marimo-tex\u003E the total number of electors.\u003C/span\u003E\n\u003Cspan class=\"paragraph\"\u003ESubscripts like \u003Cmarimo-tex class=\"arithmatex\"\u003E||(n_s||)\u003C/marimo-tex\u003E and \u003Cmarimo-tex class=\"arithmatex\"\u003E||(e_s||)\u003C/marimo-tex\u003E just given will generally represent parameters of the voting system or of reality, as opposed to results of the election or our analysis, which will be represented as functions.\u003C/span\u003E\n\u003Cspan class=\"paragraph\"\u003EWe'll use variables like \u003Cmarimo-tex class=\"arithmatex\"\u003E||(x, y, z||)\u003C/marimo-tex\u003E to name particular voters. We'll write \u003Cmarimo-tex class=\"arithmatex\"\u003E||(x \\in s||)\u003C/marimo-tex\u003E to indicate that voter \u003Cmarimo-tex class=\"arithmatex\"\u003E||(x||)\u003C/marimo-tex\u003E belongs to state \u003Cmarimo-tex class=\"arithmatex\"\u003E||(s||)\u003C/marimo-tex\u003E, and will also use \u003Cmarimo-tex class=\"arithmatex\"\u003E||(s(x)||)\u003C/marimo-tex\u003E to represent the state to which voter \u003Cmarimo-tex class=\"arithmatex\"\u003E||(x||)\u003C/marimo-tex\u003E belongs.\u003C/span\u003E\n\u003Cspan class=\"paragraph\"\u003EOur general approach will be to attempt to define various \"value of a vote functions\" or \"valuations\", which will be some function of a voter like:\u003C/span\u003E\n\u003Cmarimo-tex class=\"arithmatex\"\u003E||[\nV(x) = ~~ ???\n||]\u003C/marimo-tex\u003E\u003Cspan class=\"paragraph\"\u003EWe will always define a \"value of a vote\" such that the values across an entire population sum to \u003Cmarimo-tex class=\"arithmatex\"\u003E||(N||)\u003C/marimo-tex\u003E (for some population variable), such that the \"baseline\" value of a vote is \u003Cmarimo-tex class=\"arithmatex\"\u003E||(1||)\u003C/marimo-tex\u003E, as opposed to \u003Cmarimo-tex class=\"arithmatex\"\u003E||(\\frac{1}{N}||)\u003C/marimo-tex\u003E. The project is called \"OneVote\", after all. A valuation will usually assign the same value to a lot of voters, such as all the voters in a state, meaning that its sum is:\u003C/span\u003E\n\u003Cmarimo-tex class=\"arithmatex\"\u003E||[\nN = \\sum_x V(x) = \\sum_s n_s V(s)\n||]\u003C/marimo-tex\u003E\u003Cspan class=\"paragraph\"\u003Ewhere \u003Cmarimo-tex class=\"arithmatex\"\u003E||(V(s)||)\u003C/marimo-tex\u003E is the value the valuation assigns to \u003Cem\u003Eeach\u003C/em\u003E voter in state \u003Cmarimo-tex class=\"arithmatex\"\u003E||(s||)\u003C/marimo-tex\u003E.\u003C/span\u003E\n\u003Cspan class=\"paragraph\"\u003ESpecific valuations will be written as Roman text and will always end in \"V\", like\u003C/span\u003E\n\u003Cmarimo-tex class=\"arithmatex\"\u003E||[\n\\text{AV}(x) = \\frac{e_{s(x)}}{E} \\cdot \\frac{N}{n_{s(x)}}\n||]\u003C/marimo-tex\u003E\u003Cspan class=\"paragraph\"\u003EWhen we want to refer to the actual \u003Cem\u003Evote\u003C/em\u003E cast by a voter \u003Cmarimo-tex class=\"arithmatex\"\u003E||(x||)\u003C/marimo-tex\u003E we'll use \u003Cmarimo-tex class=\"arithmatex\"\u003E||(v(x)||)\u003C/marimo-tex\u003E, which will take values in some \u003Cmarimo-tex class=\"arithmatex\"\u003E||(P||)\u003C/marimo-tex\u003E of parties, often just \u003Cmarimo-tex class=\"arithmatex\"\u003E||(\\{0, 1\\}||)\u003C/marimo-tex\u003E. The vote of a state (in an electoral college, say) will be \u003Cmarimo-tex class=\"arithmatex\"\u003E||(v(s)||)\u003C/marimo-tex\u003E.\u003C/span\u003E\n\u003Cspan class=\"paragraph\"\u003EThe result of an election will generally be a lower-case \u003Cmarimo-tex class=\"arithmatex\"\u003E||(r \\in P||)\u003C/marimo-tex\u003E or \u003Cmarimo-tex class=\"arithmatex\"\u003E||(r(s) \\in P||)\u003C/marimo-tex\u003E. An upper-case \u003Cmarimo-tex class=\"arithmatex\"\u003E||(R||)\u003C/marimo-tex\u003E will be used for the actual count of votes (with a sense like a random variable). \u003Cmarimo-tex class=\"arithmatex\"\u003E||(R||)\u003C/marimo-tex\u003E alone will stand for \"votes for party 1\" in a two-party election \u003Cmarimo-tex class=\"arithmatex\"\u003E||(\\{0, 1\\}||)\u003C/marimo-tex\u003E, while \u003Cmarimo-tex class=\"arithmatex\"\u003E||(R(p)||)\u003C/marimo-tex\u003E will stand for the count of votes for a particular party. Likewise for \u003Cmarimo-tex class=\"arithmatex\"\u003E||(R(s), R_p(s)||)\u003C/marimo-tex\u003E. The number of electors won by party \u003Cmarimo-tex class=\"arithmatex\"\u003E||(p||)\u003C/marimo-tex\u003E in state \u003Cmarimo-tex class=\"arithmatex\"\u003E||(s||)\u003C/marimo-tex\u003E will be written \u003Cmarimo-tex class=\"arithmatex\"\u003E||(e_p(s)||)\u003C/marimo-tex\u003E.\u003C/span\u003E\u003C/span\u003E"}, "type": "data"}]}, {"code_hash": "bf7c5f9b07d514c3367adb7ce00bbe9c", "console": [], "id": "Xref", "outputs": [{"data": {"text/markdown": "\u003Cspan class=\"markdown prose dark:prose-invert contents\"\u003E\u003Ch2 id=\"todo-to-think-about\"\u003ETODO to think about\u003C/h2\u003E\n\u003Cspan class=\"paragraph\"\u003EThird parties.\u003C/span\u003E\n\u003Cspan class=\"paragraph\"\u003EAbstentions.\u003C/span\u003E\u003C/span\u003E"}, "type": "data"}]}, {"code_hash": "1d0db38904205bec4d6f6f6a1f6cec3e", "console": [], "id": "SFPL", "outputs": [{"data": {"text/plain": ""}, "type": "data"}]}], "metadata": {"marimo_version": "0.19.6"}, "version": "1"},
            "runtimeConfig": null,
        };
    </script>
